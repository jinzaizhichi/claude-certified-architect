<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Certified Architect — Test Práctico</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f2f5;
  --text: #1a1a2e;
  --surface: #ffffff;
  --surface-alt: #f7fafc;
  --muted: #718096;
  --border: #e2e8f0;
  --accent: #2b6cb0;
  --accent-soft: #ebf8ff;
  --card-border: #d0dff0;
  --shadow: 0 1px 4px rgba(0,0,0,.06);
  --sidebar-bg: #1a1a2e;
  --sidebar-text: #cdd3de;
  --sidebar-muted: #7f8fa6;
  --sidebar-border: #2c2c4a;
  --sidebar-hover: #242447;
  --scenario-bg: #ebf8ff;
  --scenario-text: #2b6cb0;
  --explanation-bg: #fffbeb;
  --explanation-text: #744210;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .2s ease, color .2s ease;
}

body.dark-theme {
  --bg: #0f172a;
  --text: #e2e8f0;
  --surface: #111827;
  --surface-alt: #1f2937;
  --muted: #94a3b8;
  --border: #334155;
  --accent: #63b3ed;
  --accent-soft: #1e3a5f;
  --card-border: #475569;
  --shadow: 0 1px 4px rgba(0,0,0,.25);
  --sidebar-bg: #020617;
  --sidebar-text: #e2e8f0;
  --sidebar-muted: #94a3b8;
  --sidebar-border: #1f2937;
  --sidebar-hover: #1f2937;
  --scenario-bg: #1e3a5f;
  --scenario-text: #90cdf4;
  --explanation-bg: #3f2b1d;
  --explanation-text: #fbbf24;
}

.shell { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 260px; min-width: 260px;
  background: var(--sidebar-bg); color: var(--sidebar-text);
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-header {
  padding: 20px 16px 14px;
  font-size: 13px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--sidebar-muted); border-bottom: 1px solid var(--sidebar-border); flex-shrink: 0;
}
.sidebar-progress {
  padding: 10px 16px; font-size: 12px; color: var(--sidebar-muted);
  border-bottom: 1px solid var(--sidebar-border); flex-shrink: 0;
}
.sidebar-progress span { color: var(--sidebar-text); font-weight: 600; }
.sidebar-scroll { overflow-y: auto; flex: 1; padding: 8px 0; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: #2c2c4a; border-radius: 2px; }

.scenario-group { margin-bottom: 4px; }
.scenario-label {
  padding: 6px 16px 4px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: #4a5568;
}
.q-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 6px 16px;
  background: none; border: none; cursor: pointer;
  font-size: 13.5px; color: #a0aec0; text-align: left;
  transition: background .15s, color .15s;
  border-left: 3px solid transparent;
}
.q-btn:hover { background: var(--sidebar-hover); color: var(--sidebar-text); }
.q-btn.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }
.q-btn.answered-correct { color: #68d391; }
.q-btn.answered-correct .q-dot { background: #68d391; }
.q-btn.answered-wrong { color: #fc8181; }
.q-btn.answered-wrong .q-dot { background: #fc8181; }
.q-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0; transition: background .2s;
}

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 32px; display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
  box-shadow: var(--shadow);
}
.topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
.topbar-nav { display: flex; gap: 10px; align-items: center; }
.nav-btn {
  padding: 7px 18px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--surface);
  font-size: 14px; cursor: pointer; color: var(--text); font-weight: 500;
  transition: all .15s;
}
.nav-btn:hover { background: var(--surface-alt); border-color: var(--muted); }
.nav-btn:disabled { opacity: .35; cursor: default; }
.nav-btn.finish { background: var(--accent); color: #fff; border-color: var(--accent); }
.nav-btn.finish:hover { background: #2c5282; }
.theme-toggle { min-width: 92px; }
.q-counter { font-size: 13px; color: var(--muted); font-weight: 500; }

.content { flex: 1; overflow-y: auto; padding: 36px 48px; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 3px; }

/* Question card */
.q-card { max-width: 820px; margin: 0 auto; }
.q-scenario {
  display: inline-block; background: var(--scenario-bg); color: var(--scenario-text);
  font-size: 12px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; padding: 4px 12px;
  border-radius: 20px; margin-bottom: 16px;
}
.q-number { font-size: 13px; color: #a0aec0; margin-bottom: 6px; font-weight: 600; }
.q-situation {
  font-size: 16.5px; color: var(--text);
  font-weight: 500; line-height: 1.7;
  background: var(--surface);
  border: 1.5px solid var(--card-border);
  border-radius: 10px;
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 22px;
}
.q-situation code, .opt-text code, .explanation code {
  background: var(--surface-alt); padding: 1px 5px; border-radius: 4px;
  font-family: "SF Mono", Menlo, Monaco, monospace;
  font-size: 13.5px; color: var(--text);
}
.explanation code { background: var(--surface-alt); }
.q-prompt { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 20px; }

/* Options */
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.option {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px 18px; border: 2px solid var(--border);
  border-radius: 12px; cursor: pointer; background: var(--surface);
  transition: border-color .15s, background .15s, transform .1s;
}
.option:hover:not(.locked) {
  border-color: var(--accent); background: var(--accent-soft); transform: translateX(2px);
}
.option.locked { cursor: default; }
.opt-letter {
  width: 30px; height: 30px; min-width: 30px; border-radius: 50%;
  background: #edf2f7; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #4a5568;
  transition: background .2s, color .2s; flex-shrink: 0;
}
.opt-text { font-size: 15px; color: var(--text); line-height: 1.55; padding-top: 3px; }

.option.correct { border-color: #48bb78; background: #f0fff4; }
.option.correct .opt-letter { background: #48bb78; color: #fff; }
.option.wrong { border-color: #fc8181; background: #fff5f5; }
.option.wrong .opt-letter { background: #fc8181; color: #fff; }
.option.dimmed { opacity: .55; }

/* Dark-theme overrides to ensure readable option text/background */
body.dark-theme .option {
  background: #071226; /* dark card */
  border-color: #1f2a3a;
}
body.dark-theme .option .opt-text {
  color: #e6eef8; /* readable white-ish text */
}
body.dark-theme .option.locked {
  background: #071226;
}
body.dark-theme .option.correct {
  background: rgba(72,187,120,0.08);
  border-color: #2f855a;
}
body.dark-theme .option.correct .opt-text {
  color: #e6fff5;
}
body.dark-theme .option.wrong {
  background: rgba(252,129,129,0.06);
  border-color: #b83232;
}
body.dark-theme .option.wrong .opt-text {
  color: #ffecec;
}
body.dark-theme .opt-letter {
  background: #0f1724;
  color: #e2e8f0;
}
body.dark-theme .option.correct .opt-letter { background: #2f855a; color: #fff; }
body.dark-theme .option.wrong .opt-letter { background: #c53030; color: #fff; }
body.dark-theme .option.dimmed { opacity: .55; }

/* Explanation */
.explanation {
  margin-top: 4px; padding: 14px 18px;
  background: var(--explanation-bg); border-left: 4px solid #f6ad55;
  border-radius: 0 10px 10px 0;
  font-size: 14.5px; color: var(--explanation-text); line-height: 1.65; display: none;
}
.explanation.show { display: block; }
.explanation strong { color: var(--explanation-text); }

/* Summary */
.summary { max-width: 820px; margin: 0 auto; display: none; }
.summary.show { display: block; }
.summary h1 { font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.summary-subtitle { color: var(--muted); font-size: 15px; margin-bottom: 28px; }
.score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 32px; }
.score-card {
  background: var(--surface); border-radius: 14px; padding: 20px;
  text-align: center; box-shadow: var(--shadow);
}
.score-card .big { font-size: 38px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
.score-card .label { font-size: 13px; color: #718096; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.score-card.total .big { color: #2b6cb0; }
.score-card.correct-c .big { color: #38a169; }
.score-card.wrong-c .big { color: #e53e3e; }

.section-title {
  font-size: 18px; font-weight: 700; color: var(--text);
  margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--border);
}
.group-block {
  background: var(--surface); border-radius: 12px; padding: 18px 20px;
  margin-bottom: 16px; box-shadow: var(--shadow);
}
.group-title {
  font-size: 15px; font-weight: 700; color: var(--text);
  margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
}
.group-badge {
  font-size: 11px; padding: 2px 10px; border-radius: 20px;
  font-weight: 700; background: #fff5f5; color: #c53030;
}
.wrong-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  font-size: 14px; color: var(--text);
}
.wrong-item:last-child { border-bottom: none; }
.wrong-item .wi-n { min-width: 32px; font-weight: 700; color: #a0aec0; font-size: 12px; padding-top: 2px; }
.wrong-item .wi-q { flex: 1; }
.wrong-item .wi-situation { font-size: 13.5px; color: var(--text); font-weight: 500; margin-bottom: 4px; line-height: 1.5; }
.wrong-item .wi-situation code { background: var(--surface-alt); padding: 1px 4px; border-radius: 3px; font-family: "SF Mono", Menlo, Monaco, monospace; font-size: 12.5px; }
.wrong-item .wi-prompt { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 4px; }
.wrong-item .wi-ans { font-size: 12px; margin-top: 3px; color: var(--muted); }
.wi-wrong-tag { color: #e53e3e; font-weight: 700; }
.wi-correct-tag { color: #38a169; font-weight: 700; }

.restart-btn {
  margin-top: 28px; padding: 12px 32px;
  background: #2b6cb0; color: #fff; border: none;
  border-radius: 10px; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: background .15s;
}
.restart-btn:hover { background: #2c5282; }

.screen { display: none; }
.screen.active { display: block; }
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar">
    <div class="sidebar-header">Preguntas</div>
    <div class="sidebar-progress">Respondidas: <span id="answeredCount">0</span> / <span id="totalCount">0</span></div>
    <div class="sidebar-scroll" id="sidebarList"></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Claude Certified Architect — Test Práctico</div>
      <div class="topbar-nav">
        <span class="q-counter" id="qCounter"></span>
        <button class="nav-btn theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-pressed="false">🌙 Oscuro</button>
        <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>&#8592; Ant.</button>
        <button class="nav-btn" id="nextBtn" onclick="navigate(1)">Siguiente &#8594;</button>
        <button class="nav-btn finish" id="finishBtn" onclick="showSummary()">Terminar y revisar</button>
      </div>
    </div>
    <div class="content">
      <div class="screen active" id="questionScreen">
        <div class="q-card" id="qCard"></div>
      </div>
      <div class="screen" id="summaryScreen">
        <div class="summary show" id="summaryContent"></div>
      </div>
    </div>
  </div>
</div>
<script>
const themeToggleBtn = document.getElementById('themeToggle');

function applyTheme(theme) {
  document.body.classList.toggle('dark-theme', theme === 'dark');
  if (themeToggleBtn) {
    themeToggleBtn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
    themeToggleBtn.setAttribute('aria-pressed', String(theme === 'dark'));
  }
  if (typeof localStorage !== 'undefined') {
    localStorage.setItem('practicalTestTheme', theme);
  }
}

function toggleTheme() {
  const nextTheme = document.body.classList.contains('dark-theme') ? 'light' : 'dark';
  applyTheme(nextTheme);
}

const savedTheme = typeof localStorage !== 'undefined' ? localStorage.getItem('practicalTestTheme') : null;
const initialTheme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(initialTheme);

const QUESTIONS = [{"n": 1, "scenario": "Sistema de investigación multiagente", "situation": "Un agente de análisis de documentos descubre que dos fuentes creíbles contienen estadísticas directamente contradictorias para una métrica clave: un informe gubernamental indica un crecimiento del 40%, mientras que un análisis del sector indica un 12%. Ambas fuentes parecen creíbles, y la discrepancia podría afectar de forma sustancial las conclusiones de la investigación. ¿Cómo debería manejar esta situación el agente de análisis de documentos de la forma más eficaz?", "question": "¿Qué enfoque es más eficaz?", "options": [{"letter": "A", "text": "Aplicar heurísticas de credibilidad para elegir el número más probablemente correcto, terminar el análisis con ese valor y añadir una nota a pie de página que mencione la discrepancia.", "correct": false}, {"letter": "B", "text": "Incluir ambos números en el resultado del análisis sin marcarlos como contradictorios, dejando que el agente de síntesis decida cuál usar según un contexto más amplio.", "correct": false}, {"letter": "C", "text": "Detener el análisis y escalar de inmediato al coordinador, pidiéndole que decida qué fuente es más autorizada antes de continuar.", "correct": false}, {"letter": "D", "text": "Completar el análisis con ambos números, anotar explícitamente el conflicto con la atribución de cada fuente, y dejar que el coordinador decida cómo reconciliar los datos antes de pasarlos a síntesis.", "correct": true}], "correct": "D", "explanation": "Este enfoque preserva la separación de responsabilidades: el agente de análisis completa su trabajo principal sin bloquearse, conserva ambos valores contradictorios con una atribución clara, y traspasa correctamente la reconciliación al coordinador, que cuenta con un contexto más amplio.", "global_n": 1}, {"n": 2, "scenario": "Sistema de investigación multiagente", "situation": "Los agentes de búsqueda web y de análisis de documentos han completado sus tareas y devuelto los resultados al coordinador. ¿Cuál es el siguiente paso para crear un informe de investigación integrado?", "question": "¿Cuál es el siguiente paso más adecuado?", "options": [{"letter": "A", "text": "Cada agente envía sus resultados directamente al agente de redacción de informes, sin pasar por el coordinador.", "correct": false}, {"letter": "B", "text": "El agente de análisis de documentos solicita los resultados de la búsqueda web y los combina internamente.", "correct": false}, {"letter": "C", "text": "El coordinador pasa ambos conjuntos de resultados al agente de síntesis para una integración unificada.", "correct": true}, {"letter": "D", "text": "El coordinador concatena las salidas sin procesar de ambos agentes y las devuelve como resultado final.", "correct": false}], "correct": "C", "explanation": "En una arquitectura de coordinador-subagente, el coordinador reenvía ambos conjuntos de resultados al agente de síntesis para una integración centralizada, preservando el control y garantizando una combinación de alta calidad.", "global_n": 2}, {"n": 3, "scenario": "Sistema de investigación multiagente", "situation": "Un subagente de análisis de documentos falla con frecuencia al procesar archivos PDF: algunos tienen secciones corruptas que provocan excepciones de parseo, otros están protegidos con contraseña, y en ocasiones la librería de parseo se cuelga con archivos grandes. Actualmente, cualquier excepción termina de inmediato el subagente y devuelve un error al coordinador, que debe decidir si reintenta, omite el archivo o hace fallar toda la tarea. Esto provoca una intervención excesiva del coordinador en el manejo de errores rutinarios. ¿Qué mejora arquitectónica es más eficaz?", "question": "¿Qué mejora es más eficaz?", "options": [{"letter": "A", "text": "Crear un agente dedicado al manejo de errores que supervise todos los fallos mediante una cola compartida y decida las acciones de recuperación, enviando comandos de reinicio directamente a los subagentes.", "correct": false}, {"letter": "B", "text": "Configurar el subagente para que siempre devuelva resultados parciales con estado de éxito, incorporando los detalles del error en los metadatos; el coordinador trata todas las respuestas como exitosas.", "correct": false}, {"letter": "C", "text": "Hacer que el coordinador valide todos los documentos antes de enviarlos al subagente, rechazando aquellos que puedan causar fallos.", "correct": false}, {"letter": "D", "text": "Implementar recuperación local en el subagente para fallos transitorios y escalar al coordinador solo los errores que no pueda resolver, incluyendo los pasos intentados y los resultados parciales.", "correct": true}], "correct": "D", "explanation": "Maneja los errores en el nivel más bajo capaz de resolverlos. La recuperación local reduce la carga de trabajo del coordinador, a la vez que sigue escalando los problemas realmente irrecuperables con el contexto completo y el progreso parcial.", "global_n": 3}, {"n": 4, "scenario": "Sistema de investigación multiagente", "situation": "Después de ejecutar el sistema sobre “el impacto de la IA en las industrias creativas”, se observa que todos los subagentes se completan con éxito: el agente de búsqueda web encuentra artículos relevantes, el agente de análisis de documentos los resume correctamente, y el agente de síntesis produce un texto coherente. Sin embargo, los informes finales cubren únicamente las artes visuales y omiten por completo la música, la literatura y el cine. En los logs del coordinador se observa que descompuso el tema en tres subtareas: “IA en el arte digital”, “IA en el diseño gráfico” e “IA en la fotografía”. ¿Cuál es la causa raíz más probable?", "question": "¿Cuál es la causa raíz más probable?", "options": [{"letter": "A", "text": "El agente de síntesis carece de instrucciones para detectar vacíos de cobertura.", "correct": false}, {"letter": "B", "text": "El agente de análisis de documentos filtra las fuentes no visuales debido a criterios de relevancia demasiado estrictos.", "correct": false}, {"letter": "C", "text": "La descomposición de tareas del coordinador es demasiado limitada y asigna a los subagentes un trabajo que no cubre todas las áreas relevantes.", "correct": true}, {"letter": "D", "text": "Las consultas del agente de búsqueda web son insuficientes y deberían ampliarse para cubrir más sectores.", "correct": false}], "correct": "C", "explanation": "El coordinador descompuso un tema amplio únicamente en subtareas de arte visual, omitiendo por completo la música, la literatura y el cine. Dado que los subagentes ejecutaron correctamente sus asignaciones, la descomposición limitada es la causa raíz evidente.", "global_n": 4}, {"n": 5, "scenario": "Sistema de investigación multiagente", "situation": "El subagente de búsqueda web devuelve resultados solo para 3 de las 5 categorías de fuentes solicitadas (los sitios de la competencia y los informes del sector se obtienen correctamente, pero los archivos de noticias y los feeds de redes sociales sufren timeout). El subagente de análisis de documentos procesa con éxito todos los documentos proporcionados. El subagente de síntesis debe producir un resumen a partir de entradas previas de calidad desigual. ¿Qué estrategia de propagación de errores es más eficaz?", "question": "¿Qué estrategia de propagación de errores es más eficaz?", "options": [{"letter": "A", "text": "Continuar la síntesis usando únicamente las fuentes exitosas y producir un resultado sin mencionar qué datos no estuvieron disponibles.", "correct": false}, {"letter": "B", "text": "El subagente de síntesis devuelve un error al coordinador, lo que provoca un retry completo o el fallo de la tarea debido a datos incompletos.", "correct": false}, {"letter": "C", "text": "El subagente de síntesis le pide al coordinador que reintente con un timeout más largo las fuentes que dieron timeout, antes de comenzar la síntesis.", "correct": false}, {"letter": "D", "text": "Estructurar el resultado de la síntesis con anotaciones de cobertura que indiquen qué conclusiones están bien respaldadas y dónde existen vacíos debido a fuentes no disponibles.", "correct": true}], "correct": "D", "explanation": "Las anotaciones de cobertura implementan una degradación controlada con transparencia, preservando el valor del trabajo completado y a la vez propagando la incertidumbre para permitir decisiones informadas sobre el nivel de confianza.", "global_n": 5}, {"n": 6, "scenario": "Sistema de investigación multiagente", "situation": "El subagente de análisis de documentos encuentra un archivo PDF corrupto que no puede parsear. Al diseñar el manejo de errores del sistema, ¿cuál es la forma más eficaz de manejar este fallo?", "question": "¿Qué enfoque es más eficaz?", "options": [{"letter": "A", "text": "Devolver un error con contexto al agente coordinador, permitiéndole decidir cómo proceder.", "correct": true}, {"letter": "B", "text": "Omitir en silencio el documento corrupto y continuar procesando los archivos restantes para no interrumpir el workflow.", "correct": false}, {"letter": "C", "text": "Reintentar automáticamente el parseo del documento tres veces con backoff exponencial antes de reportar un fallo.", "correct": false}, {"letter": "D", "text": "Lanzar una excepción que termine todo el workflow de investigación.", "correct": false}], "correct": "A", "explanation": "Devolver un error con contexto al coordinador es el enfoque más eficaz porque le permite tomar una decisión informada (omitir el archivo, probar un método de parseo alternativo o notificar al usuario) manteniendo a la vez visibilidad sobre el fallo.", "global_n": 6}, {"n": 7, "scenario": "Sistema de investigación multiagente", "situation": "Los logs de producción muestran un patrón persistente: solicitudes como “analiza el informe trimestral subido” se enrutan al agente de búsqueda web el 45% de las veces en lugar de al agente de análisis de documentos. Al revisar las definiciones de las ituation": "Un colega propone que el agente de análisis de documentos envíe sus resultados directamente al agente de síntesis, sin pasar por el coordinador. ¿Cuál es la principal ventaja de mantener al coordinador como el eje central de toda la comunicación entre subagentes?", "question": "¿Cuál es la principal ventaja de mantener al coordinador como el eje central?", "options": [{"letter": "A", "text": "El coordinador puede observar todas las interacciones, manejar los errores de forma uniforme y decidir qué información debe recibir cada subagente.", "correct": true}, {"letter": "B", "text": "El coordinador agrupa múltiples solicitudes a los subagentes, reduciendo el total de llamadas a la API y la latencia general.", "correct": false}, {"letter": "C", "text": "Enrutar a través del coordinador habilita una lógica de retry automático que las llamadas directas entre agentes no pueden soportar.", "correct": false}, {"letter": "D", "text": "Los subagentes usan memoria aislada, y la comunicación directa requeriría una serialización compleja que solo el coordinador puede realizar.", "correct": false}], "correct": "A", "explanation": "El patrón de coordinador proporciona visibilidad centralizada sobre todas las interacciones, un manejo uniforme de errores en todo el sistema y un control granular sobre qué información recibe cada subagente; estas son las principales ventajas de una topología de comunicación en forma de estrella.", "global_n": 8}, {"n": 9, "scenario": "Sistema de investigación multiagente", "situation": "El subagente de búsqueda web sufre un timeout mientras investiga un tema complejo. Es necesario diseñar cómo se devuelve al coordinador la información sobre este fallo. ¿Qué enfoque de propagación de errores permite mejor una recuperación inteligente?", "question": "¿Qué enfoque de propagación de errores permite mejor una recuperación inteligente?", "options": [{"letter": "A", "text": "Devolver al coordinador un contexto de error estructurado que incluya el tipo de fallo, la consulta ejecutada, cualquier resultado parcial y posibles enfoques alternativos.", "correct": true}, {"letter": "B", "text": "Capturar el timeout dentro del subagente y devolver un conjunto de resultados vacío marcado como exitoso.", "correct": false}, {"letter": "C", "text": "Implementar retries automáticos con backoff exponencial dentro del subagente, devolviendo únicamente un estado genérico de “búsqueda no disponible” tras agotar los retries.", "correct": false}, {"letter": "D", "text": "Propagar la excepción de timeout directamente al manejador de nivel superior, terminando todo el workflow de investigación.", "correct": false}], "correct": "A", "explanation": "Devolver un contexto de error estructurado (que incluya el tipo de fallo, la consulta ejecutada, los resultados parciales y los enfoques alternativos) le da al coordinador todo lo necesario para tomar decisiones de recuperación inteligentes (por ejemplo, reintentar con una consulta modificada o continuar con los resultados parciales). Esto preserva el máximo contexto para una toma de decisiones informada a nivel de coordinación.", "global_n": 9}, {"n": 10, "scenario": "Sistema de investigación multiagente", "situation": "En el diseño del sistema, se le otorgó al agente de análisis de documentos acceso a una herramienta de propósito general, `fetch_url`, para que pudiera descargar documentos por URL. Los logs de producción muestran que este agente ahora descarga con frecuencia páginas de resultados de motores de búsqueda para realizar búsquedas web improvisadas —un comportamiento que debería enrutarse a través del agente de búsqueda web—, lo que provoca resultados inconsistentes. ¿Qué corrección es más eficaz?", "question": "¿Qué corrección es más eficaz?", "options": [{"letter": "A", "text": "Reemplazar `fetch_url` por una herramienta `load_document` que valide que las URLs apunten a formatos de documento.", "correct": true}, {"letter": "B", "text": "Eliminar `fetch_url` del agente de : true}], "correct": "D", "explanation": "Un timeout (fallo de acceso) y “0 resultados” (resultado vacío válido) son resultados semánticamente distintos que requieren respuestas diferentes. Distinguirlos le permite al coordinador reintentar la base de datos de patentes y, a la vez, aceptar los “0 resultados” de los informes de la industria como un hallazgo válido e informativo.", "global_n": 12}, {"n": 13, "scenario": "Sistema de investigación multiagente", "situation": "El monitoreo en producción muestra una calidad de síntesis inconsistente. Cuando los resultados agregados suman cerca de 75K tokens, el agente de síntesis cita de forma confiable la información de los primeros 15K tokens (titulares y fragmentos de la búsqueda web) y de los últimos 10K tokens (conclusiones del análisis de documentos), pero suele pasar por alto hallazgos críticos en los 50K tokens intermedios, incluso cuando responden directamente la pregunta de investigación. ¿Cómo deberías reestructurar la entrada agregada?", "question": "¿Cómo deberías reestructurar la entrada agregada?", "options": [{"letter": "A", "text": "Resumir todos los resultados de los subagentes a menos de 20K tokens antes de la agregación, para mantener el contenido dentro del rango de procesamiento confiable del modelo.", "correct": false}, {"letter": "B", "text": "Transmitir los resultados de los subagentes al agente de síntesis de forma incremental, procesando primero por completo los resultados de la búsqueda web y luego agregando los resultados del análisis de documentos.", "correct": false}, {"letter": "C", "text": "Colocar un resumen de hallazgos clave al inicio de la entrada agregada y organizar los resultados detallados con encabezados de sección explícitos para facilitar la navegación.", "correct": true}, {"letter": "D", "text": "Implementar una rotación que alterne cuál resultado de subagente aparece primero entre tareas de investigación, para garantizar que ambas fuentes reciban la misma posición prioritaria a  {"n": 15, "scenario": "Sistema de investigación multiagente", "situation": "En pruebas, observas que el agente de síntesis a menudo necesita verificar afirmaciones específicas mientras combina resultados. Actualmente, cuando se necesita verificación, el agente de síntesis devuelve el control al coordinador, que llama al agente de búsqueda web y luego vuelve a invocar la síntesis con los resultados. Esto agrega de 2 a 3 loops adicionales por tarea y aumenta la latencia en un 40%. Tu evaluación muestra que el 85% de estas verificaciones son comprobaciones de hechos simples (fechas, nombres, estadísticas) y el 15% requiere una investigación más profunda. ¿Qué enfoque reduce de forma más eficaz la sobrecarga sin comprometer la confiabilidad del sistema?", "question": "¿Qué enfoque es más eficaz?", "options": [{"letter": "A", "text": "Darle al agente de síntesis acceso a todas las herramientas de búsqueda web para que pueda gestionar directamente cualquier necesidad de verificación sin loops con el coordinador.", "correct": false}, {"letter": "B", "text": "Hacer que el agente de síntesis acumule todas las necesidades de verificación y las devuelva como un batch al coordinador al final, que luego las envía todas juntas al agente de búsqueda web.", "correct": false}, {"letter": "C", "text": "Hacer que el agente de búsqueda web guarde en caché de forma proactiva contexto adicional sobre cada fuente durante la investigación inicial, anticipando que la síntesis necesitará verificación.", "correct": false}, {"letter": "D", "text": "Darle al agente de síntesis una herramienta `verify_fact` de alcance limitado para comprobaciones simples, y enrutar las verificaciones complejas a través del coordinador hacia el agente de búsqueda web.", "correct": true}], "correct": "D", "explanation": "Una herramienta de verificación de hechos de alcance limitado le permite al agente de síntesis gestionar directamente el 85% de las comprobaciones simples, eliminando la mayoría de los loops, mie r los archivos en batches a lo largo de múltiples sesiones, confiando en el archivo de memoria compartida para mantener la consistencia.", "correct": false}], "correct": "A", "explanation": "Un subagente Explore aísla la salida extensa del descubrimiento en un contexto separado y devuelve solo un resumen conciso a la conversación principal. Esto preserva la ventana de contexto principal para las fases de diseño colaborativo e implementación consistente, donde el contexto retenido tiene más valor.", "global_n": 45}, {"n": 46, "scenario": "Agente de atención al cliente", "situation": "Durante las pruebas, notas que el agente a menudo llama a `get_customer` cuando los usuarios preguntan sobre el estado de un pedido, aunque `lookup_order` sería más apropiado. ¿Qué deberías revisar primero para abordar este problema?", "question": "¿Qué deberías revisar primero?", "options": [{"letter": "A", "text": "Implementar un clasificador de preprocesamiento que detecte solicitudes relacionadas con pedidos y las enrute directamente a `lookup_order`.", "correct": false}, {"letter": "B", "text": "Reducir la cantidad de herramientas disponibles para el agente, para simplificar la elección.", "correct": false}, {"letter": "C", "text": "Agregar ejemplos few-shot al system prompt que cubran todos los patrones posibles de solicitudes de pedidos, para mejorar la selección de herramientas.", "correct": false}, {"letter": "D", "text": "Revisar las descripciones de las herramientas para asegurarse de que diferencien claramente el propósito de cada una.", "correct": true}], "correct": "D", "explanation": "Las descripciones de las herramientas son el insumo principal que el modelo usa para decidir cuál llamar. Cuando un agente elige consistentemente la herramienta equivocada, el primer paso de diagnóstico es verificar que las descripciones separen con claridad el propósito y los límites de uso de cada herramienta.", "global_n": 46}, {"n": 47, "scenario": "Agente de atención al cliente", "situation": "Tu agente maneja solicitudes de un solo problema con 94% de precisión (por ejemplo, “necesito un reembolso para el pedido #1234”). Pero cuando los clientes incluyen varios problemas en un mismo mensaje (por ejemplo, “necesito un reembolso para el pedido #1234 y también quiero actualizar la dirección de envío del pedido #5678”), la precisión en la selección de herramientas cae al 58%. El agente suele resolver solo uno de los problemas o mezcla parámetros entre las solicitudes. ¿Qué enfoque mejora de manera más eficaz la confiabilidad en solicitudes con múltiples problemas?", "question": "¿Qué enfoque es más eficaz?", "options": [{"letter": "A", "text": "Implementar una capa de preprocesamiento que use una llamada al modelo separada para descomponer los mensajes con múltiples problemas en solicitudes individuales, manejar cada una de forma independiente y combinar los resultados.", "correct": false}, {"letter": "B", "text": "Combinar herramientas relacionadas en menos herramientas universales.", "correct": false}, {"letter": "C", "text": "Agregar ejemplos few-shot al prompt que demuestren el razonamiento correcto y la secuenciación de herramientas para solicitudes con múltiples problemas.", "correct": true}, {"letter": "D", "text": "Implementar validación de respuestas que detecte respuestas incompletas y vuelva a instruir automáticamente al agente para que resuelva los problemas omitidos.", "correct": false}], "correct": "C", "explanation": "Los ejemplos few-shot que demuestran el razonamiento correcto y la secuenciación de herramientas para solicitudes con múltiples problemas son lo más eficaz, porque el agente ya funciona bien con problemas individuales; lo que necesita es orientación sobre el patrón para descomponer y enrutar múltiples problemas manteniendo los parámetros separados.", "global_n": 47}, {"n": 48, "scenario": "Agente de atención al cliente", "situation": "Los logs de producción muestran que, para solicitudes simples como “reembolso para el pedido #1234”, tu agente resuelve el problema en 3 o 4 llamadas a herramientas con un 91% de éxito. Pero para solicitudes complejas como “me cobraron dos veces, mi descuento no se aplicó y quiero cancelar”, el agente promedia más de 12 llamadas a herramientas con solo un 54% de éxito —a menudo investigando los problemas de forma secuencial y obteniendo datos redundantes del cliente para cada uno. ¿Qué cambio mejora de manera más eficaz el manejo de solicitudes complejas?", "question": "¿Qué cambio es más eficaz?", "options": [{"letter": "A", "text": "Agregar puntos de verificación explícitos entre etapas, exigiendo que el agente registre el progreso después de resolver cada problema antes de pasar al siguiente.", "correct": false}, {"letter": "B", "text": "Reducir la cantidad de herramientas combinando `get_customer`, `lookup_order` y las herramientas relacionadas con facturación en una sola herramienta `investigate_issue`.", "correct": false}, {"letter": "C", "text": "Descomponer la solicitud en problemas separados, investigar cada uno en paralelo usando el contexto compartido del cliente, y luego sintetizar una resolución final.", "correct": true}, {"letter": "D", "text": "Agregar ejemplos few-shot al system prompt que demuestren secuencias ideales de llamadas a herramientas para diversos escenarios de facturación con múltiples aristas.", "correct": false}], "correct": "C", "explanation": "Descomponer en problemas separados e investigar en paralelo con contexto compartido del cliente resuelve los dos problemas clave: elimina la recuperación redundante de datos al reutilizar el contexto compartido entre problemas, y reduce el total de loops de llamadas a herramientas al paralelizar la investigación antes de sintetizar una única resolución.", "global_n": 48}, {"n": 49, "scenario": "Agente de atención al cliente", "situation": "Tu agente logra un 55% de resolución en el primer contacto, muy por debajo de la meta del 80%. Los logs muestran que escala casos simples (reemp const state = { current: 0, answers: {} };

function md(text) {
  if (!text) return '';
  return text
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, ' ');
}

function buildSidebar() {
  const list = document.getElementById('sidebarList');
  document.getElementById('totalCount').textContent = QUESTIONS.length;
  let currentScenario = null;
  let groupEl = null;
  QUESTIONS.forEach((q, idx) => {
    if (q.scenario !== currentScenario) {
      currentScenario = q.scenario;
      const sg = document.createElement('div');
      sg.className = 'scenario-group';
      const lbl = document.createElement('div');
      lbl.className = 'scenario-label';
      lbl.textContent = q.scenario;
      sg.appendChild(lbl);
      groupEl = sg;
      list.appendChild(sg);
    }
    const btn = document.createElement('button');
    btn.className = 'q-btn';
    btn.id = 'sb-' + idx;
    btn.onclick = () => goto(idx);
    btn.innerHTML = '<span class="q-dot"></span> Q' + q.global_n;
    groupEl.appendChild(btn);
  });
}

function updateSidebar() {
  QUESTIONS.forEach((q, idx) => {
    const btn = document.getElementById('sb-' + idx);
    if (!btn) return;
    btn.className = 'q-btn';
    if (idx === state.current) btn.classList.add('active');
    const ans = state.answers[q.global_n];
    if (ans !== undefined) {
      btn.classList.add(ans === q.correct ? 'answered-correct' : 'answered-wrong');
    }
  });
  document.getElementById('answeredCount').textContent = Object.keys(state.answers).length;
}

function renderQuestion(idx) {
  const q = QUESTIONS[idx];
  const chosen = state.answers[q.global_n];
  const locked = chosen !== undefined;

  document.getElementById('qCounter').textContent = (idx + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === QUESTIONS.length - 1;

  const optionsHtml = q.options.map(opt => {
    let cls = 'option';
    if (locked) {
      cls += ' locked';
      if (opt.correct) cls += ' correct';
      else if (opt.letter === chosen) cls += ' wrong';
      else cls += ' dimmed';
    }
    return '<div class="' + cls + '" data-letter="' + opt.letter + '" onclick="answer(' + q.global_n + ', \'' + opt.letter + '\')">' +
      '<div class="opt-letter">' + opt.letter + '</div>' +
      '<div class="opt-text">' + md(opt.text) + '</div></div>';
  }).join('');

  const expl = locked
    ? '<div class="explanation show"><strong>Por qué la ' + q.correct + ':</strong> ' + md(q.explanation) + '</div>'
    : '<div class="explanation"></div>';

  document.getElementById('qCard').innerHTML =
    '<div class="q-number">Pregunta ' + q.global_n + '</div>' +
    '<div class="q-scenario">' + q.scenario + '</div>' +
    '<div class="q-situation">' + md(q.situation) + '</div>' +
    '<div class="q-prompt">' + md(q.question) + '</div>' +
    '<div class="options">' + optionsHtml + '</div>' +
    expl;
}

function answer(globalN, letter) {
  if (state.answers[globalN] !== undefined) return;
  state.answers[globalN] = letter;
  renderQuestion(state.current);
  updateSidebar();
}

function navigate(dir) { goto(state.current + dir); }

function goto(idx) {
  if (idx < 0 || idx >= QUESTIONS.length) return;
  document.getElementById('questionScreen').classList.add('active');
  document.getElementById('summaryScreen').classList.remove('active');
  state.current = idx;
  renderQuestion(idx);
  updateSidebar();
}

function showSummary() {
  document.getElementById('questionScreen').classList.remove('active');
  document.getElementById('summaryScreen').classList.add('active');

  const total = QUESTIONS.length;
  const answered = Object.keys(state.answers).length;
  let correct = 0;
  const wrongByScenario = {};

  QUESTIONS.forEach(q => {
    const ans = state.answers[q.global_n];
    if (ans === undefined) return;
    if (ans === q.correct) {
      correct++;
    } else {
      if (!wrongByScenario[q.scenario]) wrongByScenario[q.scenario] = [];
      wrongByScenario[q.scenario].push({ q: q, chosen: ans });
    }
  });

  const wrong = answered - correct;
  const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
  const unanswered = total - answered;

  let wrongGroupsHtml = '';
  for (const scenario in wrongByScenario) {
    const items = wrongByScenario[scenario];
    const rows = items.map(item => {
      const chosenOpt = item.q.options.find(o => o.letter === item.chosen);
      const correctOpt = item.q.options.find(o => o.letter === item.q.correct);
      return '<div class="wrong-item">' +
        '<div class="wi-n">Q' + item.q.global_n + '</div>' +
        '<div class="wi-q">' +
          '<div class="wi-situation">' + md(item.q.situation) + '</div>' +
          '<div class="wi-prompt">' + md(item.q.question) + '</div>' +
          '<div class="wi-ans">' +
            'Tu respuesta: <span class="wi-wrong-tag">' + item.chosen + '</span> — ' + md(chosenOpt ? chosenOpt.text : '') + '<br>' +
            'Correcta: <span class="wi-correct-tag">' + item.q.correct + '</span> — ' + md(correctOpt ? correctOpt.text : '') +
          '</div>' +
        '</div></div>';
    }).join('');
    wrongGroupsHtml +=
      '<div class="group-block">' +
        '<div class="group-title">' + scenario +
          '<span class="group-badge">' + items.length + ' incorrecta(s)</span></div>' +
        rows +
      '</div>';
  }

  const unansweredNote = unanswered > 0
    ? '<p style="color:#e53e3e;font-size:14px;margin-bottom:20px;font-weight:600;">&#9888; ' + unanswered + ' pregunta(s) sin responder.</p>'
    : '';

  document.getElementById('summaryContent').innerHTML =
    '<h1>Examen completado</h1>' +
    '<p class="summary-subtitle">Respondiste ' + answered + ' de ' + total + ' preguntas.</p>' +
    unansweredNote +
    '<div class="score-grid">' +
      '<div class="score-card total"><div class="big">' + pct + '%</div><div class="label">Puntuación</div></div>' +
      '<div class="score-card correct-c"><div class="big">' + correct + '</div><div class="label">Correctas</div></div>' +
      '<div class="score-card wrong-c"><div class="big">' + wrong + '</div><div class="label">Incorrectas</div></div>' +
    '</div>' +
    (wrong > 0
      ? '<div class="section-title">Respuestas incorrectas por escenario</div>' + wrongGroupsHtml
      : '<p style="color:#38a169;font-weight:700;font-size:17px;">¡Todas las preguntas respondidas están correctas!</p>') +
    '<button class="restart-btn" onclick="restart()">Reiniciar examen</button>';
}

function restart() {
  state.answers = {};
  state.current = 0;
  document.getElementById('questionScreen').classList.add('active');
  document.getElementById('summaryScreen').classList.remove('active');
  renderQuestion(0);
  updateSidebar();
}

buildSidebar();
renderQuestion(0);
updateSidebar();
</script>
