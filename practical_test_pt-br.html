<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Certified Architect — Teste Prático</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f0f2f5;
      --text: #1a1a2e;
      --surface: #ffffff;
      --surface-alt: #f7fafc;
      --muted: #718096;
      --border: #e2e8f0;
      --accent: #2b6cb0;
      --accent-soft: #ebf8ff;
      --card-border: #d0dff0;
      --shadow: 0 1px 4px rgba(0, 0, 0, .06);
      --sidebar-bg: #1a1a2e;
      --sidebar-text: #cdd3de;
      --sidebar-muted: #7f8fa6;
      --sidebar-border: #2c2c4a;
      --sidebar-hover: #242447;
      --scenario-bg: #ebf8ff;
      --scenario-text: #2b6cb0;
      --explanation-bg: #fffbeb;
      --explanation-text: #744210;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .2s ease, color .2s ease;
    }

    body.dark-theme {
      --bg: #0f172a;
      --text: #e2e8f0;
      --surface: #111827;
      --surface-alt: #1f2937;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #63b3ed;
      --accent-soft: #1e3a5f;
      --card-border: #475569;
      --shadow: 0 1px 4px rgba(0, 0, 0, .25);
      --sidebar-bg: #020617;
      --sidebar-text: #e2e8f0;
      --sidebar-muted: #94a3b8;
      --sidebar-border: #1f2937;
      --sidebar-hover: #1f2937;
      --scenario-bg: #1e3a5f;
      --scenario-text: #90cdf4;
      --explanation-bg: #3f2b1d;
      --explanation-text: #fbd38d;
    }

    .shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--sidebar-border);
    }

    .sidebar-header {
      padding: 20px 16px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--sidebar-muted);
      border-bottom: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    .sidebar-progress {
      padding: 10px 16px;
      font-size: 12px;
      color: var(--sidebar-muted);
      border-bottom: 1px solid var(--sidebar-border);
      flex-shrink: 0;
    }

    .sidebar-progress span {
      color: var(--sidebar-text);
      font-weight: 600;
    }

    .sidebar-scroll {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: var(--sidebar-border);
      border-radius: 2px;
    }

    .scenario-group {
      margin-bottom: 4px;
    }

    .scenario-label {
      padding: 6px 16px 4px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--sidebar-muted);
    }

    .q-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 6px 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--sidebar-text);
      text-align: left;
      transition: background .15s, color .15s;
      border-left: 3px solid transparent;
    }

    .q-btn:hover {
      background: var(--sidebar-hover);
      color: var(--sidebar-text);
    }

    .q-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .q-btn.answered-correct {
      color: #68d391;
    }

    .q-btn.answered-correct .q-dot {
      background: #68d391;
    }

    .q-btn.answered-wrong {
      color: #fc8181;
    }

    .q-btn.answered-wrong .q-dot {
      background: #fc8181;
    }

    .q-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sidebar-muted);
      flex-shrink: 0;
      transition: background .2s;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar-nav {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-btn {
      padding: 7px 18px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
      transition: all .15s;
    }

    .nav-btn:hover {
      background: var(--surface-alt);
      border-color: var(--muted);
    }

    .nav-btn:disabled {
      opacity: .35;
      cursor: default;
    }

    .nav-btn.finish {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .nav-btn.finish:hover {
      opacity: .9;
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
    }

    .q-counter {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 36px 48px;
    }

    .content::-webkit-scrollbar {
      width: 6px;
    }

    .content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .q-card {
      max-width: 820px;
      margin: 0 auto;
    }

    .q-scenario {
      display: inline-block;
      background: var(--scenario-bg);
      color: var(--scenario-text);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .q-number {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .q-situation {
      font-size: 16.5px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.7;
      background: var(--surface);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .q-situation code,
    .opt-text code,
    .explanation code {
      background: var(--surface-alt);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: "SF Mono", Menlo, Monaco, monospace;
      font-size: 13.5px;
      color: var(--text);
    }

    .explanation code {
      background: rgba(246, 173, 85, 0.2);
    }

    .q-prompt {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      background: var(--surface);
      transition: border-color .15s, background .15s, transform .1s;
    }

    .option:hover:not(.locked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateX(2px);
    }

    .option.locked {
      cursor: default;
    }

    .opt-letter {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 50%;
      background: var(--surface-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      transition: background .2s, color .2s;
      flex-shrink: 0;
    }

    .opt-text {
      font-size: 15px;
      color: var(--text);
      line-height: 1.55;
      padding-top: 3px;
    }

    .option.correct {
      border-color: #48bb78;
      background: rgba(72, 187, 120, 0.15);
    }

    .option.correct .opt-letter {
      background: #48bb78;
      color: #fff;
    }

    .option.wrong {
      border-color: #fc8181;
      background: rgba(252, 129, 129, 0.15);
    }

    .option.wrong .opt-letter {
      background: #fc8181;
      color: #fff;
    }

    .option.dimmed {
      opacity: .55;
    }

    .explanation {
      margin-top: 4px;
      padding: 14px 18px;
      background: var(--explanation-bg);
      border-left: 4px solid #f6ad55;
      border-radius: 0 10px 10px 0;
      font-size: 14.5px;
      color: var(--explanation-text);
      line-height: 1.65;
      display: none;
    }

    .explanation.show {
      display: block;
    }

    .explanation strong {
      color: var(--explanation-text);
    }

    .summary {
      max-width: 820px;
      margin: 0 auto;
      display: none;
    }

    .summary.show {
      display: block;
    }

    .summary h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .summary-subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 28px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .score-card {
      background: var(--surface);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .score-card .big {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }

    .score-card .label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .score-card.total .big {
      color: var(--accent);
    }

    .score-card.correct-c .big {
      color: #38a169;
    }

    .score-card.wrong-c .big {
      color: #e53e3e;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--border);
    }

    .group-block {
      background: var(--surface);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .group-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .group-badge {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 700;
      background: rgba(252, 129, 129, 0.2);
      color: #c53030;
    }

    .wrong-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--text);
    }

    .wrong-item:last-child {
      border-bottom: none;
    }

    .wrong-item .wi-n {
      min-width: 32px;
      font-weight: 700;
      color: var(--muted);
      font-size: 12px;
      padding-top: 2px;
    }

    .wrong-item .wi-q {
      flex: 1;
    }

    .wrong-item .wi-situation {
      font-size: 13.5px;
      color: var(--text);
      font-weight: 500;
      margin-bottom: 4px;
      line-height: 1.5;
    }

    .wrong-item .wi-situation code {
      background: var(--surface-alt);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: "SF Mono", Menlo, Monaco, monospace;
      font-size: 12.5px;
    }

    .wrong-item .wi-prompt {
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 4px;
    }

    .wrong-item .wi-ans {
      font-size: 12px;
      margin-top: 3px;
      color: var(--muted);
    }

    .wi-wrong-tag {
      color: #e53e3e;
      font-weight: 700;
    }

    .wi-correct-tag {
      color: #38a169;
      font-weight: 700;
    }

    .restart-btn {
      margin-top: 28px;
      padding: 12px 32px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }

    .restart-btn:hover {
      opacity: .9;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }
  </style>
</head>

<body>
  <div class="shell">
    <nav class="sidebar">
      <div class="sidebar-header">Questões</div>
      <div class="sidebar-progress">Respondidas: <span id="answeredCount">0</span> / <span id="totalCount">0</span>
      </div>
      <div class="sidebar-scroll" id="sidebarList"></div>
    </nav>
    <div class="main">
      <div class="topbar">
        <div class="topbar-title">Claude Certified Architect — Teste Prático</div>
        <div class="topbar-nav">
          <span class="q-counter" id="qCounter"></span>
          <button class="nav-btn theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-pressed="false">🌙
            Escuro</button>
          <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>&#8592; Anter.</button>
          <button class="nav-btn" id="nextBtn" onclick="navigate(1)">Próx. &#8594;</button>
          <button class="nav-btn finish" id="finishBtn" onclick="showSummary()">Finalizar &amp; Revisar</button>
        </div>
      </div>
      <div class="content">
        <div class="screen active" id="questionScreen">
          <div class="q-card" id="qCard"></div>
        </div>
        <div class="screen" id="summaryScreen">
          <div class="summary show" id="summaryContent"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const themeToggleBtn = document.getElementById('themeToggle');

    function applyTheme(theme) {
      document.body.classList.toggle('dark-theme', theme === 'dark');
      if (themeToggleBtn) {
        themeToggleBtn.textContent = theme === 'dark' ? '☀️ Claro' : '🌙 Escuro';
        themeToggleBtn.setAttribute('aria-pressed', String(theme === 'dark'));
      }
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem('practicalTestTheme', theme);
      }
    }

    function toggleTheme() {
      const nextTheme = document.body.classList.contains('dark-theme') ? 'light' : 'dark';
      applyTheme(nextTheme);
    }

    const savedTheme = typeof localStorage !== 'undefined' ? localStorage.getItem('practicalTestTheme') : null;
    const initialTheme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(initialTheme);

    const QUESTIONS = [{ "n": 1, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Um agente de análise de documentos descobre que duas fontes credíveis contêm estatísticas diretamente contraditórias para uma métrica chave: um relatório governamental indica 40% de crescimento, enquanto uma análise da indústria indica 12%. Ambas as fontes parecem credíveis e a discrepância pode afetar materialmente as conclusões da pesquisa. Como o agente de análise de documentos deve lidar com esta situação da forma mais eficaz?", "question": "Qual abordagem é mais eficaz?", "options": [{ "letter": "A", "text": "Aplicar heurísticas de credibilidade para escolher o número mais provável de estar correto, finalizar a análise com esse valor e adicionar uma nota de rodapé mencionando a discrepância.", "correct": false }, { "letter": "B", "text": "Incluir ambos os números na saída da análise sem marcá-los como conflitantes, deixando que o agente de síntese decida qual usar com base no contexto mais amplo.", "correct": false }, { "letter": "C", "text": "Parar a análise e escalar imediatamente para o coordenador, pedindo que ele decida qual fonte é mais autoritativa antes de continuar.", "correct": false }, { "letter": "D", "text": "Concluir a análise com ambos os números, anotar explicitamente o conflito com a atribuição das fontes e deixar que o coordenador decida como reconciliar os dados antes de passar para a síntese.", "correct": true }], "correct": "D", "explanation": "Esta abordagem preserva a separação de responsabilidades: o agente de análise conclui seu trabalho principal sem bloquear, preserva ambos os valores conflitantes com atribuição clara e passa corretamente a reconciliação ao coordenador, que possui um contexto mais amplo.", "global_n": 1 }, { "n": 2, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Os agentes de busca web e de análise de documentos concluíram suas tarefas e retornaram os resultados ao coordenador. Qual é o próximo passo para criar um relatório de pesquisa integrado?", "question": "Qual é o próximo passo mais apropriado?", "options": [{ "letter": "A", "text": "Cada agente envia seus resultados diretamente para o agente de redação do relatório, ignorando o coordenador.", "correct": false }, { "letter": "B", "text": "O agente de análise de documentos solicita os resultados da busca web e os mescla internamente.", "correct": false }, { "letter": "C", "text": "O coordenador passa ambos os conjuntos de resultados para o agente de síntese para uma integração unificada.", "correct": true }, { "letter": "D", "text": "O coordenador concatena as saídas brutas de ambos os agentes e as retorna como o resultado final.", "correct": false }], "correct": "C", "explanation": "Em uma arquitetura coordenador–subagente, o coordenador encaminha ambos os conjuntos de resultados para o agente de síntese para uma integração centralizada, preservando o controle e garantindo uma fusão de alta qualidade.", "global_n": 2 }, { "n": 3, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Um subagente de análise de documentos falha frequentemente ao processar arquivos PDF: alguns possuem seções corrompidas que disparam exceções de parsing, outros são protegidos por senha e às vezes a biblioteca de parsing trava em arquivos grandes. Atualmente, qualquer exceção encerra imediatamente o subagente e retorna um erro ao coordenador, que deve decidir se tenta novamente, pula ou falha toda a tarefa. Isso causa um envolvimento excessivo do coordenador no tratamento de erros rotineiros. Qual melhoria arquitetural é mais eficaz?", "question": "Qual melhoria é mais eficaz?", "options": [{ "letter": "A", "text": "Criar um agente dedicado ao tratamento de erros que monitore todas as falhas via uma fila compartilhada e decida as ações de recuperação, enviando comandos de reinicialização diretamente aos subagentes.", "correct": false }, { "letter": "B", "text": "Configurar o subagente para sempre retornar resultados parciais com status de sucesso, embutindo detalhes do erro nos metadados; o coordenador trata todas as respostas como bem-sucedidas.", "correct": false }, { "letter": "C", "text": "Fazer com que o coordenador valide todos os documentos antes de enviá-los ao subagente, rejeitando documentos que possam causar falhas.", "correct": false }, { "letter": "D", "text": "Implementar recuperação local no subagente para falhas transitórias e escalar ao coordenador apenas os erros que ele não puder resolver, incluindo os passos tentados e os resultados parciais.", "correct": true }], "correct": "D", "explanation": "Trate erros no nível mais baixo capaz de resolvê-los. A recuperação local reduz a carga de trabalho do coordenador enquanto continua escalando problemas verdadeiramente irrecuperáveis com contexto completo e progresso parcial.", "global_n": 3 }, { "n": 4, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Após executar o sistema sobre \"o impacto da IA nas indústrias criativas\", você observa que cada subagente é concluído com sucesso: o agente de busca web encontra artigos relevantes, o agente de análise de documentos os sumariza corretamente e o agente de síntese produz um texto coerente. No entanto, os relatórios finais cobrem apenas arte visual e ignoram completamente música, literatura e cinema. Nos logs do coordenador, você vê que ele decompôs o tópico em três subtarefas: \"IA na arte digital\", \"IA no design gráfico\" e \"IA na fotografia\". Qual é a causa raiz mais provável?", "question": "Qual é a causa raiz mais provável?", "options": [{ "letter": "A", "text": "O agente de síntese não possui instruções para detectar lacunas de cobertura.", "correct": false }, { "letter": "B", "text": "O agente de análise de documentos filtra fontes não visuais devido a critérios de relevância excessivamente estritos.", "correct": false }, { "letter": "C", "text": "A decomposição de tarefas do coordenador é muito estreita, atribuindo aos subagentes um trabalho que não cobre todas as áreas relevantes.", "correct": true }, { "letter": "D", "text": "As buscas do agente de busca web são insuficientes e deveriam ser ampliadas para cobrir mais setores.", "correct": false }], "correct": "C", "explanation": "O coordenador decompôs um tópico amplo apenas em subtópicos de arte visual, ignorando completamente música, literatura e cinema. Como os subagentes executaram suas atribuições corretamente, a decomposição estreita é a causa raiz evidente.", "global_n": 4 }, { "n": 5, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "O subagente de busca web retorna resultados para apenas 3 das 5 categorias de fontes solicitadas (sites de concorrentes e relatórios da indústria obtêm sucesso, mas arquivos de notícias e feeds sociais sofrem timeout). O subagente de análise de documentos processa com sucesso todos os documentos fornecidos. O subagente de síntese deve produzir um resumo a partir dessas entradas de qualidade mista. Qual estratégia de propagação de erro é mais eficaz?", "question": "Qual estratégia de propagação de erro é mais eficaz?", "options": [{ "letter": "A", "text": "Continuar a síntese usando apenas as fontes bem-sucedidas e produzir uma saída sem mencionar quais dados estavam indisponíveis.", "correct": false }, { "letter": "B", "text": "O subagente de síntese retorna um erro ao coordenador, disparando uma retentativa completa ou falha da tarefa devido a dados incompletos.", "correct": false }, { "letter": "C", "text": "O subagente de síntese pede ao coordenador para tentar novamente as fontes que sofreram timeout com um tempo limite maior antes de iniciar a síntese.", "correct": false }, { "letter": "D", "text": "Estruturar a saída da síntese com anotações de cobertura que indiquem quais conclusões são bem fundamentadas e onde existem lacunas devido a fontes indisponíveis.", "correct": true }], "correct": "D", "explanation": "Anotações de cobertura implementam degradação graciosa com transparência, preservando o valor do trabalho concluído enquanto propagam a incerteza para permitir decisões informadas sobre a confiança.", "global_n": 5 }, { "n": 6, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "O subagente de análise de documentos encontra um arquivo PDF corrompido que não consegue analisar. Ao projetar o tratamento de erros do sistema, qual é a forma mais eficaz de lidar com esta falha?", "question": "Qual abordagem é mais eficaz?", "options": [{ "letter": "A", "text": "Retornar um erro com contexto ao agente coordenador, permitindo que ele decida como proceder.", "correct": true }, { "letter": "B", "text": "Ignorar silenciosamente o documento corrompido e continuar processando os arquivos restantes para evitar a interrupção do fluxo de trabalho.", "correct": false }, { "letter": "C", "text": "Tentar novamente analisar o documento automaticamente três vezes com backoff exponencial antes de relatar uma falha.", "correct": false }, { "letter": "D", "text": "Lançar uma exceção que encerre todo o fluxo de trabalho de pesquisa.", "correct": false }], "correct": "A", "explanation": "Retornar um erro com contexto ao coordenador é a abordagem mais eficaz porque permite que o coordenador tome uma decisão informada — pular o arquivo, tentar um método de parsing alternativo ou notificar o usuário — mantendo a visibilidade da falha.", "global_n": 6 }, { "n": 7, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Logs de produção mostram um padrão persistente: solicitações como \"analise o relatório trimestral enviado\" são roteadas para o agente de busca web 45% das vezes em vez de irem para o agente de análise de documentos. Ao revisar as definições das ferramentas, você descobre que o agente de busca web possui uma ferramenta `analyze_content` descrita como \"analisa conteúdo e extrai informações chave\", enquanto o agente de análise de documentos possui uma ferramenta `analyze_document` descrita como \"analisa documentos e extrai informações chave\". Como você deve corrigir este problema de roteamento?", "question": "Como você deve corrigir o problema de roteamento?", "options": [{ "letter": "A", "text": "Adicionar um classificador prévio que detecte se o usuário se refere a arquivos enviados ou conteúdo web antes que o coordenador decida sobre a delegação.", "correct": false }, { "letter": "B", "text": "Renomear a ferramenta de busca web para `extract_web_results` e atualizar sua descrição para \"processa e retorna informações recuperadas de buscas web e URLs.\"", "correct": true }, { "letter": "C", "text": "Adicionar exemplos few-shot ao prompt do coordenador mostrando o roteamento correto: \"Usuário envia um relatório trimestral → agente de análise de documentos\" e \"Usuário pergunta sobre uma página web → agente de busca web\".", "correct": false }, { "letter": "D", "text": "Expandir a descrição da ferramenta de análise de documentos com exemplos de uso como \"Use para PDFs enviados, documentos Word e planilhas\", deixando a ferramenta de busca web inalterada.", "correct": false }], "correct": "B", "explanation": "Renomear a ferramenta de busca web para `extract_web_results` e atualizar sua descrição para referenciar explicitamente busca web e URLs elimina diretamente a causa raiz ao remover a sobreposição semântica entre os nomes e descrições das duas ferramentas. Isso torna o propósito de cada ferramenta inequívoco, permitindo que o coordenador diferencie com precisão a análise de documentos da busca web.", "global_n": 7 }, { "n": 8, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Um colega propõe que o agente de análise de documentos envie seus resultados diretamente para o agente de síntese, ignorando o coordenador. Qual é a principal vantagem de manter o coordenador como o hub central para toda a comunicação entre subagentes?", "question": "Qual é a principal vantagem de manter o coordenador como o hub central?", "options": [{ "letter": "A", "text": "O coordenador pode observar todas as interações, tratar erros de forma uniforme e decidir quais informações cada subagente deve receber.", "correct": true }, { "letter": "B", "text": "O coordenador agrupa múltiplas requisições para os subagentes em lote, reduzindo o total de chamadas de API e a latência geral.", "correct": false }, { "letter": "C", "text": "O roteamento através do coordenador permite uma lógica de retentativa automática que chamadas diretas entre agentes não conseguem suportar.", "correct": false }, { "letter": "D", "text": "Os subagentes usam memória isolada, e a comunicação direta exigiria uma serialização complexa que apenas o coordenador pode realizar.", "correct": false }], "correct": "A", "explanation": "O padrão coordenador fornece visibilidade centralizada sobre todas as interações, tratamento uniforme de erros em todo o sistema e controle detalhado sobre quais informações cada subagente recebe — essas são as principais vantagens de uma topologia de comunicação em estrela (*star-shaped*).", "global_n": 8 }, { "n": 9, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "O subagente de busca web sofre timeout ao pesquisar um tópico complexo. Você precisa projetar como as informações sobre esta falha são retornadas ao coordenador. Qual abordagem de propagação de erro permite a recuperação mais inteligente?", "question": "Qual abordagem de propagação de erro permite a recuperação mais inteligente?", "options": [{ "letter": "A", "text": "Retornar contexto de erro estruturado ao coordenador incluindo o tipo de falha, a busca executada, quaisquer resultados parciais e potenciais abordagens alternativas.", "correct": true }, { "letter": "B", "text": "Capturar o timeout dentro do subagente e retornar um conjunto de resultados vazio marcado como sucesso.", "correct": false }, { "letter": "C", "text": "Implementar retentativas automáticas com backoff exponencial dentro do subagente, retornando apenas um status genérico \"busca indisponível\" após esgotar as tentativas.", "correct": false }, { "letter": "D", "text": "Propagar a exceção de timeout diretamente para o manipulador de nível superior, encerrando todo o fluxo de trabalho de pesquisa.", "correct": false }], "correct": "A", "explanation": "Retornar contexto de erro estruturado — incluindo tipo de falha, busca executada, resultados parciais e abordagens alternativas — dá ao coordenador tudo o que precisa para tomar decisões inteligentes de recuperação (ex: tentar novamente com uma busca modificada ou continuar com resultados parciais). Preserva o máximo de contexto para a tomada de decisões no nível de coordenação.", "global_n": 9 }, { "n": 10, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "No design do seu sistema, você deu ao agente de análise de documentos acesso a uma ferramenta de propósito geral `fetch_url` para que ele pudesse baixar documentos por URL. Logs de produção mostram que este agente agora baixa frequentemente páginas de resultados de motores de busca para realizar buscas web ad-hoc — comportamento que deveria ser roteado pelo agente de busca web —, causando resultados inconsistentes. Qual correção é mais eficaz?", "question": "Qual correção é mais eficaz?", "options": [{ "letter": "A", "text": "Substituir `fetch_url` por uma ferramenta `load_document` que valide se as URLs apontam para formatos de documento.", "correct": true }, { "letter": "B", "text": "Remover `fetch_url` do agente de análise de documentos e rotear todo o download de URLs através do coordenador para o agente de busca web.", "correct": false }, { "letter": "C", "text": "Implementar uma filtragem que bloqueie chamadas de `fetch_url` para domínios de motores de busca conhecidos enquanto permite outras URLs.", "correct": false }, { "letter": "D", "text": "Adicionar instruções ao prompt do agente de análise de documentos informando que `fetch_url` deve ser usada apenas para baixar URLs de documentos, e não para pesquisar.", "correct": false }], "correct": "A", "explanation": "Substituir uma ferramenta de propósito geral por uma ferramenta específica para documentos que valida URLs contra formatos de documento corrige a causa raiz ao restringir a capacidade no nível da interface. Isso segue o princípio do menor privilégio, tornando impossível o comportamento indesejado de busca em vez de meramente desaconselhá-lo.", "global_n": 10 }, { "n": 11, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Ao pesquisar um tópico amplo, você observa que o agente de busca web e o agente de análise de documentos investigam os mesmos subtópicos, levando a uma duplicação substancial em suas saídas. O uso de tokens quase dobra sem um aumento proporcional na abrangência ou profundidade da pesquisa. Qual é a forma mais eficaz de resolver isso?", "question": "Qual é a forma mais eficaz de resolver isso?", "options": [{ "letter": "A", "text": "Permitir que ambos os agentes concluam em paralelo e depois fazer com que o coordenador remova a duplicação dos resultados sobrepostos antes de passá-los ao agente de síntese.", "correct": false }, { "letter": "B", "text": "O coordenador particiona explicitamente o espaço de pesquisa antes de delegar, atribuindo a cada agente subtópicos ou tipos de fontes distintos.", "correct": true }, { "letter": "C", "text": "Implementar um mecanismo de estado compartilhado onde os agentes registram sua área de foco atual para que outros agentes possam evitar duplicações dinamicamente durante a execução.", "correct": false }, { "letter": "D", "text": "Mudar para a execução sequencial onde a análise de documentos roda apenas após a busca web ser concluída, usando os resultados da busca web como contexto para evitar duplicações.", "correct": false }], "correct": "B", "explanation": "Fazer com que o coordenador particione explicitamente o espaço de pesquisa antes de delegar é o mais eficaz porque resolve a causa raiz — fronteiras de tarefas não claras — antes do início de qualquer trabalho. Preserva o paralelismo enquanto evita esforços duplicados e tokens desperdiçados.", "global_n": 11 }, { "n": 12, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Durante a pesquisa, o subagente de busca web consulta três categorias de fontes com resultados diferentes: bancos de dados acadêmicos retornam 15 artigos relevantes, relatórios da indústria retornam \"0 resultados\" e bancos de dados de patentes retornam \"Connection timeout\". Ao projetar a propagação de erros para o coordenador, qual abordagem permite as melhores decisões de recuperação?", "question": "Qual abordagem permite as melhores decisões de recuperação?", "options": [{ "letter": "A", "text": "Agregar os resultados em uma única métrica de porcentagem de sucesso (ex: \"67% de cobertura de fontes\") com logs detalhados disponíveis sob demanda.", "correct": false }, { "letter": "B", "text": "Relatar tanto \"timeout\" quanto \"0 resultados\" como falhas que exigem a intervenção do coordenador.", "correct": false }, { "letter": "C", "text": "Tentar novamente falhas transitórias internamente e relatar apenas erros persistentes.", "correct": false }, { "letter": "D", "text": "Distinguir falhas de acesso (timeout), que exigem uma decisão de retentativa, de resultados vazios válidos (\"0 resultados\"), que representam buscas bem-sucedidas.", "correct": true }], "correct": "D", "explanation": "Um timeout (falha de acesso) e \"0 resultados\" (resultado vazio válido) são desfechos semanticamente diferentes que exigem respostas diferentes. Distingui-los permite que o coordenador tente novamente o banco de dados de patentes enquanto aceita os \"0 resultados\" dos relatórios da indústria como uma descoberta válida e informativa.", "global_n": 12 }, { "n": 13, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "O monitoramento de produção mostra uma qualidade de síntese inconsistente. Quando os resultados agregados chegam a ~75K tokens, o agente de síntese cita com precisão informações dos primeiros 15K tokens (manchetes/trechos de busca web) e dos últimos 10K tokens (conclusões de análise de documentos), mas frequentemente perde descobertas críticas nos 50K tokens do meio — mesmo quando elas respondem diretamente à pergunta de pesquisa. Como você deve reestruturar a entrada agregada?", "question": "Como você deve reestruturar a entrada agregada?", "options": [{ "letter": "A", "text": "Sumarizar todas as saídas dos subagentes para menos de 20K tokens antes da agregação para manter o conteúdo dentro do alcance de processamento confiável do modelo.", "correct": false }, { "letter": "B", "text": "Transmitir os resultados dos subagentes para o agente de síntese incrementalmente, processando os resultados de busca web primeiro até a conclusão, e depois adicionando os resultados de análise de documentos.", "correct": false }, { "letter": "C", "text": "Colocar um resumo das principais descobertas no início da entrada agregada e organizar os resultados detalhados com cabeçalhos de seção explícitos para facilitar a navegação.", "correct": true }, { "letter": "D", "text": "Implementar uma rotação que alterne qual resultado de subagente aparece primeiro entre as tarefas de pesquisa para garantir que ambas as fontes obtenham posicionamento de topo igual ao longo do tempo.", "correct": false }], "correct": "C", "explanation": "Colocar um resumo das principais descobertas no início aproveita o efeito de primazia para que informações críticas fiquem na posição processada com maior confiabilidade. Adicionar cabeçalhos de seção explícitos ao longo do texto ajuda o modelo a navegar e atentar ao conteúdo do meio da entrada, mitigando diretamente o fenômeno \"lost in the middle\".", "global_n": 13 }, { "n": 14, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Em testes, a saída combinada do agente de busca web (85K tokens incluindo conteúdo de páginas) e do agente de análise de documentos (70K tokens incluindo cadeias de raciocínio) soma 155K tokens, mas o agente de síntese atinge o melhor desempenho com entradas abaixo de 50K tokens. Qual solução é mais eficaz?", "question": "Qual solução é mais eficaz?", "options": [{ "letter": "A", "text": "Modificar os agentes de montante (*upstream*) para retornar dados estruturados (fatos chave, citações, pontuações de relevância) em vez de conteúdos e raciocínios verbosos.", "correct": true }, { "letter": "B", "text": "Adicionar um agente intermediário de sumarização que condense os achados antes de passá-los para a síntese.", "correct": false }, { "letter": "C", "text": "Fazer com que o agente de síntese processe as descobertas em lotes sequenciais, mantendo o estado entre as chamadas.", "correct": false }, { "letter": "D", "text": "Armazenar as descobertas em um banco de dados vetorial e dar ao agente de síntese ferramentas de busca para consultar durante seu trabalho.", "correct": false }], "correct": "A", "explanation": "Modificar os agentes de montante para retornar dados estruturados corrige a causa raiz ao reduzir o volume de tokens na fonte enquanto preserva informações essenciais. Evita a passagem de conteúdos volumosos de páginas e rastros de raciocínio que inflacionam os tokens sem melhorar o passo de síntese.", "global_n": 14 }, { "n": 15, "scenario": "Sistema de Pesquisa Multi-Agente", "situation": "Em testes, você observa que o agente de síntese frequentemente precisa verificar afirmações específicas enquanto mescla resultados. Atualmente, quando a verificação é necessária, o agente de síntese devolve o controle ao coordenador, que chama o agente de busca web e depois re-invoca a síntese com os resultados. Isso adiciona 2 a 3 loops extras por tarefa e aumenta a latência em 40%. Sua avaliação mostra que 85% dessas verificações são checagens simples de fatos (datas, nomes, estatísticas) e 15% exigem pesquisas mais profundas. Qual abordagem reduz mais eficazmente a sobrecarga mantendo a confiabilidade do sistema?", "question": "Qual abordagem é mais eficaz?", "options": [{ "letter": "A", "text": "Dar ao agente de síntese acesso a todas as ferramentas de busca web para que ele possa lidar diretamente com qualquer necessidade de verificação sem loops no coordenador.", "correct": false }, { "letter": "B", "text": "Fazer com que o agente de síntese acumule todas as necessidades de verificação e as retorne como um lote ao coordenador no final, que então envia todas para o agente de busca web de uma só vez.", "correct": false }, { "letter": "C", "text": "Fazer com que o agente de busca web faça cache proativo de contexto extra em torno de cada fonte durante a pesquisa inicial em antecipação à necessidade de verificação da síntese.", "correct": false }, { "letter": "D", "text": "Dar ao agente de síntese uma ferramenta de escopo limitado `verify_fact` para checagens simples, enquanto roteia verificações complexas através do coordenador para o agente de busca web.", "correct": true }], "correct": "D", "explanation": "Uma ferramenta de verificação de fatos com escopo limitado permite que o agente de síntese lide com 85% das checagens simples diretamente, eliminando a maioria dos loops, enquanto preserva o caminho de delegação ao coordenador para os 15% de verificações complexas. Isso aplica o menor privilégio enquanto reduz significativamente a latência.", "global_n": 15 }, { "n": 16, "scenario": "Claude Code para CI/CD", "situation": "Seu pipeline de CI roda a CLI do Claude Code (em modo `--print`) usando o CLAUDE.md para fornecer contexto de projeto para revisão de código, e os desenvolvedores geralmente acham as revisões substanciais. No entanto, eles relatam que integrar as descobertas no fluxo de trabalho é difícil — o Claude gera parágrafos narrativos que devem ser copiados manualmente para comentários no PR. A equipe deseja publicar automaticamente cada descoberta como um comentário *inline* separado no PR no local relevante do código, o que exige dados estruturados com caminho do arquivo, número da linha, nível de severidade e correção sugerida. Qual abordagem é mais eficaz?", "question": "Qual abordagem é mais eficaz?", "options": [{ "letter": "A", "text": "Adicionar uma seção \"Output Format for Review\" ao CLAUDE.md com exemplos de achados estruturados para que o Claude aprenda o formato esperado a partir do contexto do projeto.", "correct": false }, { "letter": "B", "text": "Usar as flags da CLI `--output-format json` e `--json-schema` para impor achados estruturados, e depois analisar a saída para publicar comentários *inline* via API do GitHub.", "correct": true }, { "letter": "C", "text": "Incluir instruções explícitas de formatação no prompt de revisão exigindo que cada descoberta siga um template analisável como `[FILE:caminho] [LINE:n] [SEVERITY:nivel] ...`.", "correct": false }, { "letter": "D", "text": "Manter o formato de revisão narrativa, mas adicionar um passo de sumarização que use o Claude para gerar um resumo JSON estruturado das descobertas.", "correct": false }], "correct": "B", "explanation": "Usar `--output-format json` com `--json-schema` impõe uma saída estruturada no nível da CLI, garantindo um JSON bem-formado com os campos exigidos (caminho do arquivo, linha, severidade, sugestão de correção) que pode ser analisado com segurança e publicado como comentários *inline* via API do GitHub. Aproveita recursos nativos da CLI projetados especificamente para saídas estruturadas.", "global_n": 16 }, { "n": 17, "scenario": "Claude Code para CI/CD", "situation": "Sua equipe usa o Claude Code para gerar sugestões de código, mas você nota um padrão: problemas não óbvios — otimizações de desempenho que quebram casos de borda, limpezas que alteram inesperadamente o comportamento — só são capturados quando outro membro da equipe revisa o PR. O raciocínio do Claude durante a geração mostra que ele considerou esses casos, mas concluiu que sua abordagem estava correta. Qual abordagem aborda diretamente a causa raiz desta limitação de auto-checagem?", "question": "Qual abordagem aborda diretamente a causa raiz?", "options": [{ "letter": "A", "text": ions": [{ "letter": "A", "text": "Desativar temporariamente categorias com altos falsos positivos (estilo, nomes, documentação) e manter apenas categorias de alta precisão enquanto melhora os prompts.", "correct": true }, { "letter": "B", "text": "Manter todas as categorias ativas mas exibir pontuações de confiança em cada achado para que os desenvolvedores decidam o que investigar.", "correct": false }, { "letter": "C", "text": "Manter todas as categorias ativas e adicionar exemplos few-shot para melhorar a precisão de cada categoria ao longo das próximas semanas.", "correct": false }, { "letter": "D", "text": "Aplicar uma redução uniforme de rigor em todas as categorias para diminuir a taxa geral de falsos positivos.", "correct": false }], "correct": "A", "explanation": "Desativar temporariamente categorias com altos falsos positivos interrompe imediatamente a erosão da confiança ao remover achados ruidosos que levam os desenvolvedores a ignorar tudo, enquanto preserva o valor de categorias de alta precisão como segurança e correção. Também cria espaço para melhorar os prompts de categorias problemáticas antes de reativá-las.", "global_n": 29 }, { "n": 30, "scenario": "Claude Code para CI/CD", "situation": "Sua equipe deseja reduzir custos de API para análises automatizadas. Atualmente, chamadas síncronas ao Claude atendem dois fluxos de trabalho: (1) uma checagem pré-merge bloqueante que deve ser concluída antes que os desenvolvedores façam o merge, e (2) um relatório de débito técnico gerado da noite para o dia para revisão na manhã seguinte. Seu gerente propõe mover ambos para a Message Batches API para economizar 50%. Como você deve avaliar esta proposta?", "question": "Como você deve avaliar esta proposta?", "options": [{ "letter": "A", "text": "Mover o relatório de débito técnico para lote e manter a checagem pré-merge síncrona.", "correct": true }, { "letter": "B", "text": "Mover ambos para processamento em lote e fazer polling até a conclusão.", "correct": false }, { "letter": "C", "text": "Manter chamadas síncronas para ambos para evitar problemas de ordenação nos resultados.", "correct": false }, { "letter": "D", "text": "Mover ambos para lote com um fallback síncrono caso o lote demore muito.", "correct": false }], "correct": "A", "explanation": "A API de Message Batches oferece 50% de economia mas pode levar até 24 horas sem SLA de latência garantido, tornando-a inadequada para checagens pré-merge em tempo real, mas perfeita para tarefas agendadas sem urgência imediata.", "global_n": 30 }, { "n": 31, "scenario": "Extração de Dados Estruturados", "situation": "Você está projetando um sistema de extração para faturas que contêm campos opcionais (ex: número da ordem de compra, identificador de isenção fiscal). Seu esquema JSON marca esses campos como obrigatórios (`required`). O que provavelmente acontecerá durante a extração?", "question": "O que provavelmente acontecerá?", "options": [{ "letter": "A", "text": "O modelo falhará ao gerar o JSON e retornará um erro sintático.", "correct": false }, { "letter": "B", "text": "O modelo omitirá o objeto inteiro de fatura quando um campo opcional estiver ausente.", "correct": false }, { "letter": "C", "text": "O modelo inventará ou alucinará valores para atender às restrições de campos obrigatórios.", "correct": true }, { "letter": "D", "text": "O modelo retornará automaticamente `null` para campos ausentes.", "correct": false }], "correct": "C", "explanation": "Marcar campos como obrigatórios no esquema JSON força o modelo a fornecer um valor para cada campo exigido. Quando a informação está ausente no documento de origem, a restrição obriga o modelo a inventar ou alucinar valores para produzir um JSON válido que atenda ao esquema.", "global_n": 31 }, { "n": 32, "scenario": "Extração de Dados Estruturados", "situation": "Seu sistema extrai dados de relatórios financeiros onde os valores numéricos são apresentados em diferentes formatos (ex: \"US$ 1,2 milhão\", \"1.200.000 USD\", \"R$ 1,2M\"). Você precisa que a saída contenha valores numéricos padronizados e códigos de moeda ISO. Qual abordagem é mais confiável?", "question": "Qual abordagem é mais confiável?", "options": [{ "letter": "A", "text": "Incluir regras explícitas de normalização no prompt com exemplos few-shot demonstrando a conversão de vários formatos de entrada para valores numéricos padrão e códigos ISO.", "correct": true }, { "letter": "B", "text": "Usar um pós-processamento com expressões regulares (*regex*) para identificar e converter os valores numéricos após a extração.", "correct": false }, { "letter": "C", "text": "Confiar que o esquema JSON sozinho converterá os formatos de entrada para números.", "correct": false }, { "letter": "D", "text": "Solicitar ao modelo que retorne os valores exatamente como aparecem no documento e fazer a conversão em código posteriormente.", "correct": false }], "correct": "A", "explanation": "O modelo possui excelente capacidade de compreensão contextual para interpretar linguagens naturais e formatos variados de valores numéricos. Fornecer regras explícitas de normalização e exemplos few-shot guia o modelo a realizar a padronização diretamente durante a extração de forma altamente confiável.", "global_n": 32 }, { "n": 33, "scenario": "Extração de Dados Estruturados", "situation": "Um sistema de extração de currículos precisa categorizar o nível de experiência dos candidatos em um dos quatro níveis: \"Júnior\", \"Pleno\", \"Sênior\" ou \"Especialista\". Alguns currículos contêm perfis atípicos ou informações insuficientes para determinar o nível com clareza. Qual design de esquema e prompt é mais adequado?", "question": "Qual design é mais adequado?", "options": [{ "letter": "A", "text": "Usar um enum com `[\"Júnior\", \"Pleno\", \"Sênior\", \"Especialista\"]` e instruir o modelo a escolher o nível mais próximo mesmo que duvidoso.", "correct": false }, { "letter": "B", "text": "Usar um enum incluindo `\"Indeterminado\"` mais um campo opcional `justificativa` para explicar a incerteza.", "correct": true }, { "letter": "C", "text": "Usar uma string livre para o nível de experiência em vez de um enum.", "correct": false }, { "letter": "D", "text": "Marcar o campo de nível de experiência como opcional e omiti-lo quando for incerto.", "correct": false }], "correct": "B", "explanation": "Permitir uma opção explícita de incerteza (`\"Indeterminado\"`) juntamente com uma justificativa evita que o modelo force uma classificação incorreta ao se deparar com casos ambíguos, mantendo a integridade dos dados categorizados.", "global_n": 33 }, { "n": 34, "scenario": "Extração de Dados Estruturados", "situation": "Seu pipeline extrai itens de linha de faturas. Em 5% dos casos, a soma dos valores extraídos dos itens de linha não atinge o valor total declarado na fatura devido a taxas ou descontos não detectados. Como seu pipeline de validação deve tratar essa inconsistência?", "question": "Como tratar essa inconsistência?", "options": [{ "letter": "A", "text": "Falhar o pipeline e descartar a extração.", "correct": false }, { "letter": "B", "text": "Ajustar automaticamente o total declarado para igualar a soma dos itens de linha.", "correct": false }, { "letter": "C", "text": "Disparar um loop de retentativa com feedback incluindo os itens extraídos, a soma calculada, o total declarado e a instrução para re-verificar o documento em busca de taxas ou descontos omitidos.", "correct": true }, { "letter": "D", "text": "Aceitar a extração e marcar uma flag global de erro.", "correct": false }], "correct": "C", "explanation": "Um loop de retentativa com feedback de erro específico orienta o modelo a re-examinar o documento com foco nos itens ou valores que podem ter sido ignorados, corrigindo a inconsistência sem alterar dados declarados de forma arbitrária.", "global_n": 34 }, { "n": 35, "scenario": "Extração de Dados Estruturados", "situation": "Você processa 50.000 documentos usando a Message Batches API. Ao receber os resultados do lote, você nota que 350 documentos falharam devido a limites de tokens excedidos. Como você deve proceder para concluir o processamento desses documentos com falha?", "question": "Como você deve proceder?", "options": [{ "letter": "A", "text": "Re-enviar todo o lote de 50.000 documentos novamente.", "correct": false }, { "letter": "B", "text": "Identificar os 350 documentos pelo `custom_id`, aplicar uma estratégia de divisão (*chunking*) nos documentos longos e re-enviar apenas esses 350 em um novo lote.", "correct": true }, { "letter": "C", "text": "Processar os 350 documentos individualmente de forma síncrona sem alterar a estratégia de prompt.", "correct": false }, { "letter": "D", "text": "Marcar os 350 documentos como irrecuperáveis e descartá-los.", "correct": false }], "correct": "B", "explanation": "O uso de `custom_id` permite isolar exatamente os itens que falharam. Modificar a estratégia para tratar documentos muito longos (como dividi-los em partes) e re-enviar apenas o subconjunto afetado otimiza tempo e custos.", "global_n": 35 }, { "n": 36, "scenario": "Extração de Dados Estruturados", "situation": "Uma empresa precisa extrair dados de formulários médicos digitalizados. A precisão geral do sistema é de 98%, mas para um tipo específico de formulário antigo a taxa de erro nos nomes dos medicamentos chega a 30%. Qual estratégia de supervisão/auditoria é mais eficaz para detectar e mitigar esse problema?", "question": "Qual estratégia é mais eficaz?", "options": [{ "letter": "A", "text": "Realizar amostragem aleatória simples de 1% de todos os formulários processados.", "correct": false }, { "letter": "B", "text": "Implementar amostragem aleatória estratificada analisando a precisão dividida por tipo de formulário e por campo específico.", "correct": true }, { "letter": "C", "text": "Aumentar o limite de confiança necessário para automação de 90% para 99% em todos os campos.", "correct": false }, { "letter": "D", "text": "Exigir revisão humana para 100% dos formulários médicos.", "correct": false }], "correct": "B", "explanation": "A amostragem estratificada permite segmentar as métricas de qualidade por tipo de documento e campo individual, revelando bolsas de alta taxa de erro que seriam mascaradas por métricas de precisão agregadas globais.", "global_n": 36 }, { "n": 37, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Um assistente conversacional de suporte financeiro atende a uma conversa longa que atingiu 60 turnos e 80.000 tokens. O usuário mencionou sua renda e metas no 3º turno. No 60º turno, ao pedir uma recomendação de plano de aposentadoria, o assistente ignora as metas mencionadas no início. O histórico é enviado completo a cada turno. Qual é o fenômeno causador deste problema?", "question": "Qual é a causa?", "options": [{ "letter": "A", "text": "O modelo atingiu o limite rígido da API e truncou as mensagens iniciais.", "correct": false }, { "letter": "B", "text": "O efeito \"Lost in the Middle\" (Perdido no Meio), onde informações no meio de um histórico muito longo perdem a atenção do modelo em relação ao início e ao fim.", "correct": true }, { "letter": "C", "text": "Falta de um parâmetro de temperatura adequado para conversas longas.", "correct": false }, { "letter": "D", "text": "O assistente limpou a memória automaticamente ao ultrapassar 50 turnos.", "correct": false }], "correct": "B", "explanation": "Em janelas de contexto muito grandes, a atenção do modelo tende a se concentrar no início (system prompt e primeiras mensagens) e no final (mensagens mais recentes), reduzindo a capacidade de resgatar detalhes específicos localizados no meio da sequência de contexto.", "global_n": 37 }, { "n": 38, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Para mitigar o crescimento descontrolado do histórico em um chat de suporte, sua equipe decide aplicar uma sumarização progressiva das mensagens antigas. Qual é o principal risco dessa abordagem para dados transacionais e de identificação?", "question": "Qual é o principal risco?", "options": [{ "letter": "A", "text": "O tempo de resposta da API aumentará proporcionalmente ao tamanho do resumo.", "correct": false }, { "letter": "B", "text": "Dados precisos como números de documentos, códigos de erro, datas e valores podem ser generalizados ou perder precisão durante a sumarização.", "correct": true }, { "letter": "C", "text": "O modelo se recusará a responder mensagens que tenham resumos no histórico.", "correct": false }, { "letter": "D", "text": "A sumarização altera o papel (*role*) das mensagens de `user` para `system`.", "correct": false }], "correct": "B", "explanation": "A sumarização abstrativa frequentemente substitui valores exatos e datas específicas por descrições aproximadas ou resumidas (ex: \"o cliente mencionou um valor alto\"), perdendo detalhes cruciais necessários para chamadas de ferramentas de precisão.", "global_n": 38 }, { "n": 39, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Como arquiteto, você deseja implementar a melhor estratégia para manter informações transacionais críticas (como ID do cliente, número do pedido e status da conta) sempre disponíveis e precisas em uma conversa longa de suporte, sem depender da sumarização do histórico. Qual estrutura você deve adotar?", "question": "Qual estrutura você deve adotar?", "options": [{ "letter": "A", "text": "Gravar as informações em um banco vetorial e fazer busca semântica a cada turno.", "correct": false }, { "letter": "B", "text": "Manter um bloco estruturado de \"Fatos do Caso\" (*Case Facts*) atualizado, que é anexado a todo prompt fora do histórico sumarizado.", "correct": true }, { "letter": "C", "text": "Repetir as informações cruciais no final de cada mensagem enviada pelo usuário.", "correct": false }, { "letter": "D", "text": "Confiar que o system prompt sozinho manterá a memória de todas as variáveis.", "correct": false }], "correct": "B", "explanation": "Extrair e manter um bloco explícito de \"Fatos do Caso\" garante que dados exatos permaneçam intactos e visíveis a cada requisição, imunes à perda de precisão que ocorre na sumarização do histórico de conversa.", "global_n": 39 }, { "n": 40, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Durante uma interação de atendimento, o usuário diz: \"Quero alterar o endereço de entrega do meu pedido #9988\". Em seguida, o agente chama `update_shipping_address` diretamente. No entanto, o sistema da empresa exige confirmação explícita do usuário com a exibição do novo endereço formatado antes de efetivar qualquer alteração de cadastro. Como estruturar essa interação com segurança?", "question": "Como estruturar com segurança?", "options": [{ "letter": "A", "text": "Confiar na instrução do prompt para que o agente peça confirmação verbal antes de chamar a ferramenta.", "correct": false }, { "letter": "B", "text": "Dividir o processo em duas ferramentas: `preview_address_change` (que retorna o endereço formatado e um token de confirmação) e `confirm_address_change` (que exige o token para efetivar a alteração no banco).", "correct": true }, { "letter": "C", "text": "Executar a alteração e enviar uma mensagem dizendo \"Endereço alterado, me avise se quiser desfazer\".", "correct": false }, { "letter": "D", "text": "Usar uma ferramenta única com um parâmetro `force: true`.", "correct": false }], "correct": "B", "explanation": "Garantir a exigência no nível da arquitetura de ferramentas (exigindo um token que só a ferramenta de prévia gera) impede que o modelo execute a alteração final diretamente sem passar pela etapa de exibição e confirmação prévias.", "global_n": 40 }, { "n": 41, "scenario": "Geração de Código com o Claude Code", "situation": "Você precisa configurar o Claude Code em um projeto monorepo para que as regras de linting e estilo do React sejam aplicadas apenas quando arquivos sob a pasta `packages/ui/` forem modificados. O que você deve fazer?", "question": "O que você deve fazer?", "options": [{ "letter": "A", "text": "Criar um arquivo `~/.claude/CLAUDE.md` com as regras do React.", "correct": false }, { "letter": "B", "text": "Criar um arquivo `.claude/rules/react-ui.md` com o frontmatter YAML contendo `paths: [\"packages/ui/**/*\"]`.", "correct": true }, { "letter": "C", "text": "Incluir as regras no `package.json` da raiz.", "correct": false }, { "letter": "D", "text": "Adicionar as regras diretamente na descrição da ferramenta Edit.", "correct": false }], "correct": "B", "explanation": "O uso de arquivos em `.claude/rules/` com a propriedade `paths` no frontmatter YAML permite o carregamento condicional e direcionado de convenções com base em padrões de caminho, economizando contexto.", "global_n": 41 }, { "n": 42, "scenario": "Geração de Código com o Claude Code", "situation": "Um desenvolvedor deseja criar um comando personalizado `/benchmark` no Claude Code para uso estritamente pessoal, sem compartilhar com o restante da equipe no repositório Git. Onde esse arquivo de comando deve ser salvo?", "question": "Onde o arquivo deve ser salvo?", "options": [{ "letter": "A", "text": "Em `.claude/commands/benchmark.md` no repositório do projeto.", "correct": false }, { "letter": "B", "text": "Em `~/.claude/commands/benchmark.md` ou `~/.claude/skills/benchmark/SKILL.md` no diretório home do usuário.", "correct": true }, { "letter": "C", "text": "No arquivo `CLAUDE.md` na raiz do projeto.", "correct": false }, { "letter": "D", "text": "Em `/tmp/benchmark.md`.", "correct": false }], "correct": "B", "explanation": "Arquivos salvos no diretório home do usuário (`~/.claude/`) são pessoais e não entram no controle de versão do projeto, mantendo os comandos individuais isolados.", "global_n": 42 }, { "n": 43, "scenario": "Geração de Código com o Claude Code", "situation": "Ao utilizar o Claude Code em uma sessão longa de refatoração, o modelo começa a apresentar respostas mais lentas e omite convenções definidas no início da sessão. Qual comando nativo da CLI pode ser executado para condensar o histórico e liberar a janela de contexto?", "question": "Qual comando nativo usar?", "options": [{ "letter": "A", "text": "`/reset`", "correct": false }, { "letter": "B", "text": "`/compact`", "correct": true }, { "letter": "C", "text": "`/clear`", "correct": false }, { "letter": "D", "text": "`/clean-context`", "correct": false }], "correct": "B", "explanation": "O comando `/compact` sumariza o histórico de conversa acumulado até o momento, reduzindo o uso da janela de contexto e restaurando o desempenho e a atenção do modelo.", "global_n": 43 }, { "n": 44, "scenario": "Geração de Código com o Claude Code", "situation": "Sua equipe deseja adicionar um servidor MCP do GitHub para buscar PRs e verificar status de CI via Claude Code. Cada um dos seis desenvolvedores possui seu próprio token de acesso pessoal do GitHub. Você quer ferramentas consistentes em toda a equipe sem commitar credenciais no controle de versão.", "question": "Qual abordagem de configuração é mais eficaz?", "options": [{ "letter": "A", "text": "Fazer com que cada desenvolvedor adicione o servidor no escopo de usuário via `claude mcp add --scope user`.", "correct": false }, { "letter": "B", "text": "Criar um wrapper de servidor MCP que leia tokens de um arquivo `.env` e faça proxy das chamadas da API do GitHub, depois adicionar o wrapper ao `.mcp.json` do projeto.", "correct": false }, { "letter": "C", "text": "Adicionar o servidor ao `.mcp.json` do projeto usando substituição de variável de ambiente (`${GITHUB_TOKEN}`) para autenticação e documentar a variável de ambiente necessária no README do projeto.", "correct": true }, { "letter": "D", "text": "Configurar o servidor no escopo do projeto com um token de marcador de posição (placeholder) e dizer aos desenvolvedores para sobrescrevê-lo em sua configuração local.", "correct": false }], "correct": "C", "explanation": "Um arquivo `.mcp.json` de projeto com substituição de variável de ambiente é a forma idiomática: fornece uma fonte única da verdade versionada para a configuração do MCP enquanto permite que cada desenvolvedor forneça credenciais via variáveis de ambiente. Documentar a variável facilita a integração (*onboarding*) sem commitar segredos.", "global_n": 44 }, { "n": 45, "scenario": "Geração de Código com o Claude Code", "situation": "Você está adicionando wrappers de tratamento de erro em torno de chamadas de API externas em uma base de código de 120 arquivos. O trabalho possui três fases: (1) descobrir todos os locais de chamada e padrões, (2) projetar colaborativamente a abordagem de tratamento de erros, e (3) implementar os wrappers de forma consistente. Na Fase 1, o Claude gera uma saída grande listando centenas de locais de chamada com contexto, preenchendo rapidamente a janela de contexto antes que a descoberta termine.", "question": "Qual abordagem é mais eficaz para concluir a tarefa mantendo a consistência da implementação?", "options": [{ "letter": "A", "text": "Usar um subagente Explore para a Fase 1 para isolar a saída verbosa de descoberta e retornar um resumo, continuando depois as Fases 2–3 na conversa principal.", "correct": true }, { "letter": "B", "text": "Fazer todas as fases na conversa principal, usando periodicamente `/compact` para reduzir o uso do contexto enquanto avança pelos arquivos.", "correct": false }, { "letter": "C", "text": "Mudar para o modo headless com `--continue`, passando resumos explícitos de contexto entre chamadas em lote para manter a continuidade.", "correct": false }, { "letter": "D", "text": "Definir o padrão de tratamento de erro no CLAUDE.md e depois processar arquivos em lotes em múltiplas sessões contando com o arquivo de memória compartilhada para consistência.", "correct": false }], "correct": "A", "explanation": "Um subagente Explore isola a saída verbosa de descoberta em um contexto separado e retorna apenas um resumo conciso para a conversa principal. Isso preserva a janela de contexto principal para as fases de design colaborativo e implementação consistente onde o contexto mantido é mais valioso.", "global_n": 45 }, { "n": 46, "scenario": "Agente de Suporte ao Cliente", "situation": "Durante os testes, você nota que o agente frequentemente chama `get_customer` quando os usuários perguntam sobre o status do pedido, embora `lookup_order` fosse mais apropriado. O que você deve verificar primeiro para resolver este problema?", "question": "O que você deve verificar primeiro?", "options": [{ "letter": "A", "text": "Implementar um classificador de pré-processamento para detectar solicitações relacionadas a pedidos e roteá-las diretamente para `lookup_order`.", "correct": false }, { "letter": "B", "text": "Reduzir o número de ferramentas disponíveis para o agente para simplificar a escolha.", "correct": false }, { "letter": "C", "text": "Adicionar exemplos few-shot ao system prompt cobrindo todos os padrões possíveis de solicitação de pedidos para melhorar a seleção de ferramentas.", "correct": false }, { "letter": "D", "text": "Verificar as descrições das ferramentas para garantir que elas diferenciem claramente o propósito de cada ferramenta.", "correct": true }], "correct": "D", "explanation": "As descrições das ferramentas são a entrada primária que o modelo usa para decidir qual ferramenta chamar. Quando um agente escolhe consistentemente a ferramenta errada, o primeiro passo diagnóstico é verificar se as descrições das ferramentas separam claramente o propósito de cada uma e suas fronteiras de uso.", "global_n": 46 }, { "n": 47, "scenario": "Agente de Suporte ao Cliente", "situation": "Seu agente lida com solicitações de problema único com 94% de precisão (ex: \"preciso de um reembolso para o pedido #1234\"). Mas quando os clientes incluem múltiplos problemas em uma única mensagem (ex: \"preciso de um reembolso para o pedido #1234 e também quero atualizar o endereço de entrega do pedido #567 tes que o agente as processe. É mais manutenível porque as transformações residem no código e são aplicadas uniformemente, em vez de depender da interpretação do LLM.", "global_n": 59 }, { "n": 60, "scenario": "Agente de Suporte ao Cliente", "situation": "Logs de produção mostram que o agente às vezes escolhe `get_customer` quando `lookup_order` seria mais apropriado, especialmente para consultas ambíguas como \"preciso de ajuda com minha compra recente\". Você decide adicionar exemplos few-shot ao system prompt para melhorar a seleção de ferramentas. Qual abordagem aborda o problema com mais eficácia?", "question": "Qual abordagem é mais eficaz?", "options": [{ "letter": "A", "text": "Adicionar orientações explícitas \"use quando\" e \"não use quando\" na descrição de cada ferramenta cobrindo casos ambíguos.", "correct": false }, { "letter": "B", "text": "Adicionar exemplos agrupados por ferramenta — todos os cenários de `get_customer` juntos, depois todos os cenários de `lookup_order`.", "correct": false }, { "letter": "C", "text": "Adicionar 4–6 exemplos direcionados aos cenários ambíguos, cada um com justificativa de por que uma ferramenta foi escolhida em relação a alternativas plausíveis.", "correct": true }, { "letter": "D", "text": "Adicionar 10–15 exemplos de solicitações claras e inequívocas demonstrando a escolha correta de ferramentas para cenários típicos para cada ferramenta.", "correct": false }], "correct": "C", "explanation": "Direcionar exemplos few-shot para os cenários ambíguos específicos onde ocorrem erros, com justificativa explícita de por que uma ferramenta é preferível a alternativas, ensina ao modelo o processo comparativo de decisão necessário para casos de borda. Isso é mais eficaz do que exemplos genéricos ou regras declarativas.", "global_n": 60 }];

    const state = { current: 0, answers: {} };

    function md(text) {
      if (!text) return '';
      return text
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\r?\n/g, ' ');
    }
    ``

    function buildSidebar() {
      const list = document.getElementById('sidebarList');
      document.getElementById('totalCount').textContent = QUESTIONS.length;
      let currentScenario = null;
      let groupEl = null;
      QUESTIONS.forEach((q, idx) => {
        if (q.scenario !== currentScenario) {
          currentScenario = q.scenario;
          const sg = document.createElement('div');
          sg.className = 'scenario-group';
          const lbl = document.createElement('div');
          lbl.className = 'scenario-label';
          lbl.textContent = q.scenario;
          sg.appendChild(lbl);
          groupEl = sg;
          list.appendChild(sg);
        }
        const btn = document.createElement('button');
        btn.className = 'q-btn';
        btn.id = 'sb-' + idx;
        btn.onclick = () => goto(idx);
        btn.innerHTML = '<span class="q-dot"></span> Q' + q.global_n;
        groupEl.appendChild(btn);
      });
    }

    function updateSidebar() {
      QUESTIONS.forEach((q, idx) => {
        const btn = document.getElementById('sb-' + idx);
        if (!btn) return;
        btn.className = 'q-btn';
        if (idx === state.current) btn.classList.add('active');
        const ans = state.answers[q.global_n];
        if (ans !== undefined) {
          btn.classList.add(ans === q.correct ? 'answered-correct' : 'answered-wrong');
        }
      });
      document.getElementById('answeredCount').textContent = Object.keys(state.answers).length;
    }

    function renderQuestion(idx) {
      const q = QUESTIONS[idx];
      const chosen = state.answers[q.global_n];
      const locked = chosen !== undefined;

      document.getElementById('qCounter').textContent = (idx + 1) + ' / ' + QUESTIONS.length;
      document.getElementById('prevBtn').disabled = idx === 0;
      document.getElementById('nextBtn').disabled = idx === QUESTIONS.length - 1;

      const optionsHtml = q.options.map(opt => {
        let cls = 'option';

        if (locked) {
          cls += ' locked';

          if (opt.correct) {
            cls += ' correct';
          } else if (opt.letter === chosen) {
            cls += ' wrong';
          } else {
            cls += ' dimmed';
          }
        }

        return `
    <div class="${cls}"
         data-letter="${opt.letter}"
         onclick="answer(${q.global_n}, '${opt.letter}')">
      <div class="opt-letter">${opt.letter}</div>
      <div class="opt-text">${md(opt.text)}</div>
    </div>
  `;
      }).join('');

      const expl = locked
        ? '<div class="explanation show"><strong>Por que a ' + q.correct + ':</strong> ' + md(q.explanation) + '</div>'
        : '<div class="explanation"></div>';

      document.getElementById('qCard').innerHTML =
        '<div class="q-number">Questão ' + q.global_n + '</div>' +
        '<div class="q-scenario">' + q.scenario + '</div>' +
        '<div class="q-situation">' + md(q.situation) + '</div>' +
        '<div class="q-prompt">' + md(q.question) + '</div>' +
        '<div class="options">' + optionsHtml + '</div>' +
        expl;
    }

    function answer(globalN, letter) {
      if (state.answers[globalN] !== undefined) return;
      state.answers[globalN] = letter;
      renderQuestion(state.current);
      updateSidebar();
    }

    function navigate(dir) { goto(state.current + dir); }

    function goto(idx) {
      if (idx < 0 || idx >= QUESTIONS.length) return;
      document.getElementById('questionScreen').classList.add('active');
      document.getElementById('summaryScreen').classList.remove('active');
      state.current = idx;
      renderQuestion(idx);
      updateSidebar();
    }

    function showSummary() {
      document.getElementById('questionScreen').classList.remove('active');
      document.getElementById('summaryScreen').classList.add('active');

      const total = QUESTIONS.length;
      const answered = Object.keys(state.answers).length;
      let correct = 0;
      const wrongByScenario = {};

      QUESTIONS.forEach(q => {
        const ans = state.answers[q.global_n];
        if (ans === undefined) return;
        if (ans === q.correct) {
          correct++;
        } else {
          if (!wrongByScenario[q.scenario]) wrongByScenario[q.scenario] = [];
          wrongByScenario[q.scenario].push({ q: q, chosen: ans });
        }
      });

      const wrong = answered - correct;
      const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
      const unanswered = total - answered;

      let wrongGroupsHtml = '';
      for (const scenario in wrongByScenario) {
        const items = wrongByScenario[scenario];
        const rows = items.map(item => {
          const chosenOpt = item.q.options.find(o => o.letter === item.chosen);
          const correctOpt = item.q.options.find(o => o.letter === item.q.correct);
          return '<div class="wrong-item">' +
            '<div class="wi-n">Q' + item.q.global_n + '</div>' +
            '<div class="wi-q">' +
            '<div class="wi-situation">' + md(item.q.situation) + '</div>' +
            '<div class="wi-prompt">' + md(item.q.question) + '</div>' +
            '<div class="wi-ans">' +
            'Sua resposta: <span class="wi-wrong-tag">' + item.chosen + '</span> — ' + md(chosenOpt ? chosenOpt.text : '') + '<br>' +
            'Correta: <span class="wi-correct-tag">' + item.q.correct + '</span> — ' + md(correctOpt ? correctOpt.text : '') +
            '</div>' +
            '</div></div>';
        }).join('');
        wrongGroupsHtml +=
          '<div class="group-block">' +
          '<div class="group-title">' + scenario +
          '<span class="group-badge">' + items.length + ' incorreta(s)</span></div>' +
          rows +
          '</div>';
      }

      const unansweredNote = unanswered > 0
        ? '<p style="color:#e53e3e;font-size:14px;margin-bottom:20px;font-weight:600;">&#9888; ' + unanswered + ' questão(ões) não respondida(s).</p>'
        : '';

      document.getElementById('summaryContent').innerHTML =
        '<h1>Exame Concluído</h1>' +
        '<p class="summary-subtitle">Você respondeu ' + answered + ' de ' + total + ' questões.</p>' +
        unansweredNote +
        '<div class="score-grid">' +
        '<div class="score-card total"><div class="big">' + pct + '%</div><div class="label">Pontuação</div></div>' +
        '<div class="score-card correct-c"><div class="big">' + correct + '</div><div class="label">Corretas</div></div>' +
        '<div class="score-card wrong-c"><div class="big">' + wrong + '</div><div class="label">Incorretas</div></div>' +
        '</div>' +
        (wrong > 0
          ? '<div class="section-title">Respostas incorretas por cenário</div>' + wrongGroupsHtml
          : '<p style="color:#38a169;font-weight:700;font-size:17px;">Todas as questões respondidas estão corretas!</p>') +
        '<button class="restart-btn" onclick="restart()">Reiniciar Exame</button>';
    }

    function restart() {
      state.answers = {};
      state.current = 0;
      document.getElementById('questionScreen').classList.add('active');
      document.getElementById('summaryScreen').classList.remove('active');
      renderQuestion(0);
      updateSidebar();
    }

    buildSidebar();
    renderQuestion(0);
    updateSidebar();
  </script>
